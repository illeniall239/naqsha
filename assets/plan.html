<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
  --accent: #2f5bd3; --on-accent: #ffffff; --warn-bg: #fff6e0; --warn: #8a5a00; --ok: #1f7a46; --bad: #b42318; --code: #f2f1ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #a3a29c; --line: #34332f;
    --accent: #8aa8ff; --on-accent: #10204d; --warn-bg: #3a2d10; --warn: #f2c46b; --ok: #6fcf97; --bad: #ff8a80; --code: #2a2a27;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }
header h1 { font-size: 1.7rem; margin: 0 0 6px; line-height: 1.25; }
.meta { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.tabs { display: flex; gap: 2px; margin: 18px 0 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tabs [role=tab] { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; white-space: nowrap; color: var(--muted); font-size: .92rem; }
.tabs [role=tab]:hover { color: var(--text); }
.tabs [role=tab][aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs [role=tab].todo::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 6px; border-radius: 50%; background: var(--warn); vertical-align: middle; }
.count-badge { display: inline-block; min-width: 1.5em; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); font-size: .75rem; font-weight: 700; text-align: center; }
.count-badge:empty { display: none; }
.phases { list-style: none; padding: 0; margin: 14px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.phase { display: inline-flex; gap: 8px; align-items: center; border-radius: 999px; padding: 4px 12px 4px 5px; }
.phase .num { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--line); font-size: .8rem; font-weight: 700; }
.phase.current { border-color: var(--accent); }
.phase.current .num { background: var(--accent); color: var(--on-accent); }
.phase.complete .num { background: var(--ok); color: var(--on-accent); }
.phase-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
details.answered { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 10px; }
details.answered summary { cursor: pointer; color: var(--muted); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 14px 0; scroll-margin-top: 12px; }
section > h2 { font-size: 1.15rem; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h3 { font-size: .95rem; margin: 14px 0 6px; }
h3:first-child { margin-top: 0; }
a { color: var(--accent); }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .85rem; }
ul { margin: 4px 0; padding-left: 20px; }
li { margin: 2px 0; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
.scroll { overflow-x: auto; }
.badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.s-draft, .s-open, .s-todo { color: var(--warn); }
.s-approved, .s-decided, .s-done { color: var(--ok); }
.s-building, .s-doing { color: var(--accent); }
.s-blocked, .v-avoid { color: var(--bad); }
.v-adopt { color: var(--ok); }
.v-learn-from { color: var(--accent); }
.na, .muted { color: var(--muted); }
.empty { color: var(--warn); font-style: italic; }
.waiting { background: var(--warn-bg); border-color: var(--warn); }
.waiting h2 { color: var(--warn); }
.decision { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.decision:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 8px 0; }
.option { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.option.rec { border-color: var(--accent); }
.option.chosen { border-color: var(--ok); border-width: 2px; }
.option h4 { margin: 0 0 4px; font-size: .92rem; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: .85rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.stat b { display: block; font-size: 1.3rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.diagram { overflow-x: auto; }
ol.tests { margin: 2px 0; padding-left: 20px; font-size: .88rem; }
footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
button { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
button.link { border: 0; background: none; color: var(--accent); padding: 0 2px; font-size: .85rem; font-weight: 400; }
input[type=text], textarea { display: block; width: 100%; font: inherit; font-size: .92rem; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
textarea { resize: vertical; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.q { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.q:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.choices { display: grid; gap: 6px; margin: 8px 0 0; }
.choice { display: flex; gap: 8px; align-items: baseline; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.choice.rec { border-color: var(--accent); }
label.option { display: block; cursor: pointer; }
.choice:has(input:checked), label.option:has(input:checked) { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); }
.sent { color: var(--ok); font-size: .85rem; }
.sendbar { position: sticky; bottom: 8px; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 10px 12px; margin-top: 14px; box-shadow: 0 4px 18px rgba(0, 0, 0, .15); }
.sendbar input { flex: 1 1 220px; margin: 0; }
.sendbar .count { font-size: .9rem; }
.status { flex-basis: 100%; font-size: .85rem; color: var(--muted); }
.status:empty { display: none; }
.status.bad { color: var(--bad); }
.frames-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
.frames-bar button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.screen { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; scroll-margin-top: 12px; }
.screen h3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.frame { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin: 8px auto 0; max-width: 100%; }
.frame iframe { border: 0; display: block; transform-origin: 0 0; }
.options.wide { grid-template-columns: 1fr; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.swatch .chip { height: 56px; border-radius: 6px; border: 1px solid var(--line); }
.swatch small { display: block; color: var(--muted); }
.swatch small.low { color: var(--bad); font-weight: 600; }
@media (max-width: 560px) { .pc { grid-template-columns: 1fr; } }
@media print {
  .tabs, .phases, .phase-nav, footer, .sendbar, button { display: none; }
  [role=tabpanel][hidden], [data-phase-panel][hidden] { display: block !important; }
  section { break-inside: avoid; }
}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading plan.js…</p></main>
<script>
'use strict';
const app = document.getElementById('app');
let last = '';
let plan = null;
let pending = null;

// Served by scripts/serve.js, the page can send answers and comments to
// Claude. Opened as a file it is read-only.
const KEY = new URLSearchParams(location.search).get('key');
const LIVE = /^https?:$/.test(location.protocol) && !!KEY;
const asking = p => LIVE && (p.meta || {}).status === 'draft';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Plain text with `code` spans and line breaks; everything else stays escaped.
const txt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
const isNa = v => v && typeof v === 'object' && !Array.isArray(v) && typeof v.na === 'string';
const has = v => isNa(v) || (Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.keys(v).length > 0 : !!v);
const na = v => `<p class="na">Not applicable: ${txt(v.na)}</p>`;
const empty = '<p class="empty">Not written yet.</p>';
const badge = s => s ? `<span class="badge s-${esc(s)}">${esc(s)}</span>` : '';
const url = u => /^https?:\/\//i.test(u || '') ? esc(u) : null;
const list = (items, f = txt) => isNa(items) ? na(items) : Array.isArray(items) && items.length ? `<ul>${items.map(i => `<li>${f(i)}</li>`).join('')}</ul>` : empty;
const ref = r => r ? ` <code>${esc(r)}</code>` : '';
const table = (rows, cols) => {
  if (isNa(rows)) return na(rows);
  if (!Array.isArray(rows) || !rows.length) return empty;
  return `<div class="scroll"><table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
// An empty dependency list is an answer ("none"); elsewhere empty means unwritten.
const present = (p, id) => id === 'later' || id === 'current' ? true : id === 'impact' ? isNa(p.context) || has(p.impact) || isNa(p.impact)
  : ['dependencies', 'needsYou'].includes(id) ? Array.isArray(p[id]) || isNa(p[id]) : has(p[id]);
// The failing tests a step starts from, in order.
const stepTests = t => isNa(t) ? `<br><span class="muted">No test first: ${txt(t.na)}</span>`
  : Array.isArray(t) && t.length ? `<br><b>Tests first</b><ol class="tests">${t.map(x => `<li>${txt(x.test)}${x.kind ? ` <span class="muted">· ${esc(x.kind)}</span>` : ''}</li>`).join('')}</ol>`
  : '<br><span class="empty">No tests listed</span>';
// The build's size in the work Claude does, as an honest stand-in for hours.
// Mirrors plan-tool.js reviewFor, from what the plan states explicitly.
function buildSize(p) {
  const steps = Array.isArray(p.steps) ? p.steps : [];
  const effort = (p.meta || {}).effort || 'standard';
  const threats = p.security && Array.isArray(p.security.threats) ? p.security.threats : [];
  const hot = p.architecture && Array.isArray(p.architecture.hotPaths) ? p.architecture.hotPaths : [];
  const std = (s, r) => Array.isArray(s.standards) && s.standards.includes(r);
  const reviewed = steps.filter(s => effort === 'thorough' || threats.some(t => t.step === s.id) ||
    (effort === 'standard' && (std(s, 'data-and-apis') || std(s, 'reliability') || hot.some(h => h.provedBy === s.id)))).length;
  const runs = 2 + (effort === 'light' ? 0 : steps.filter(s => std(s, 'run-like-a-user')).length);
  return { steps: steps.length, reviewed, runs, effort };
}

// ---- what the user is writing --------------------------------------------

// Kept in this browser until sent, so a reload or a plan.js refresh never
// loses it. `sent` remembers what went out, to show it and not send it twice.
let draft = { answers: {}, comments: {}, message: '', sent: {} };
let status = { text: '', bad: false };
const opened = new Set();
const storeKey = () => 'naqsha:' + ((plan && plan.meta && plan.meta.slug) || location.pathname);
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    if (d) draft = { answers: d.answers || {}, comments: d.comments || {}, message: d.message || '', sent: d.sent || {} };
  } catch { /* storage blocked: the draft lives in memory only */ }
}
function saveDraft() {
  try { localStorage.setItem(storeKey(), JSON.stringify(draft)); } catch { /* same */ }
}

const openItems = p => [
  ...(Array.isArray(p.questions) ? p.questions.filter(q => q.status !== 'answered') : []),
  ...(Array.isArray(p.decisions) ? p.decisions.filter(d => d.status !== 'decided') : []),
];
const answered = a => !!a && (a.choice.length > 0 || a.text.trim() !== '');
const unsent = (id, a) => answered(a) && draft.sent[id] !== JSON.stringify(a);
const answerText = a => !a ? '' : typeof a === 'string' ? a
  : [(a.choice || []).join(', '), a.text, a.note && `(${a.note})`].filter(Boolean).join(' · ');

const choice = (id, value, multiple, rec) => `<label class="choice${rec ? ' rec' : ''}">
    <input type="${multiple ? 'checkbox' : 'radio'}" name="ans-${esc(id)}" data-id="${esc(id)}" data-f="choice" value="${esc(value)}">
    <span>${txt(value)}${rec ? ' <span class="badge s-building">recommended</span>' : ''}</span></label>`;
const ownAnswer = (id, label) => `<input type="text" data-id="${esc(id)}" data-f="text" placeholder="${label}" aria-label="${esc(id)}: ${label}">`;
const noteBox = id => `<textarea data-id="${esc(id)}" data-f="note" rows="2" placeholder="Notes for Claude (optional)" aria-label="${esc(id)}: notes"></textarea>`;
const sentLine = id => draft.sent[id] ? `<p class="sent" data-sent="${esc(id)}"></p>` : '';

function question(q, ask) {
  const opts = Array.isArray(q.options) ? q.options : [];
  let body = '';
  if (q.status === 'answered') {
    body = `<p><b>Answer:</b> ${txt(answerText(q.answer))}</p>`;
  } else if (ask && opts.length) {
    body = `<div class="choices">${opts.map(o => choice(q.id, o, q.multiple, o === q.recommendation)).join('')}</div>
      ${ownAnswer(q.id, 'Something else')}${noteBox(q.id)}${sentLine(q.id)}`;
  } else if (ask) {
    body = `<textarea data-id="${esc(q.id)}" data-f="text" rows="3" placeholder="Your answer" aria-label="${esc(q.id)}: your answer"></textarea>${sentLine(q.id)}`;
  } else if (opts.length) {
    body = list(opts, o => txt(o) + (o === q.recommendation ? ' <span class="muted">(recommended)</span>' : ''));
  }
  return `<div class="q" id="${esc(q.id)}">
      <h3>${esc(q.id)} · ${txt(q.question)} ${badge(q.status || 'open')}</h3>
      ${q.why ? `<p class="muted">${txt(q.why)}</p>` : ''}${body}</div>`;
}

function decision(d, ask, idPrefix = '') {
  const pick = ask && d.status !== 'decided';
  const card = o => {
    const rec = o.name === d.recommendation;
    const inner = `<h4>${pick ? `<input type="radio" name="ans-${esc(d.id)}" data-id="${esc(d.id)}" data-f="choice" value="${esc(o.name)}"> ` : ''}${txt(o.name)}${
      o.name === d.choice ? ' ✓ chosen' : rec ? ' · recommended' : ''}</h4>
      <div class="pc"><div><b>Pros</b>${list(o.pros)}</div><div><b>Cons</b>${list(o.cons)}</div></div>
      ${o.preview ? frame(frameDoc(null, o.preview, false), `${o.name}, preview`, 'desktop') : ''}`;
    const cls = `option${rec ? ' rec' : ''}${o.name === d.choice ? ' chosen' : ''}`;
    return pick ? `<label class="${cls}">${inner}</label>` : `<div class="${cls}">${inner}</div>`;
  };
  return `<div class="decision" id="${esc(idPrefix + d.id)}">
      <h3>${esc(d.id)} · ${txt(d.question)} ${badge(d.status)}</h3>
      <div class="options${(d.options || []).some(o => o.preview) ? ' wide' : ''}">${(d.options || []).map(card).join('')}</div>
      ${d.why ? `<p><b>Why the recommendation:</b> ${txt(d.why)}</p>` : ''}
      ${(d.drivers || []).length ? `<p><b>Serves:</b> ${d.drivers.map(id => `<code>${esc(id)}</code>`).join(' ')}</p>` : ''}
      ${d.consequences ? `<p><b>Consequences:</b> ${txt(d.consequences)}</p>` : ''}
      ${d.confirmation ? `<p><b>How we'll know it was right:</b> ${txt(d.confirmation)}</p>` : ''}
      ${pick ? ownAnswer(d.id, 'Something else (instead of the options above)') + noteBox(d.id) + sentLine(d.id) : ''}
      ${d.status === 'decided' ? `<p><b>Decided:</b> ${txt(d.choice)} <span class="muted">(${esc(d.decidedBy)})</span>${d.note ? ` · ${txt(d.note)}` : ''}</p>` : ''}
    </div>`;
}

// ---- design previews --------------------------------------------------------

// A design's screens render in sandboxed frames with no scripts, styled only by
// its tokens, so the user sees the real look before any code exists.
const WIDTHS = { phone: [390, 780], tablet: [820, 1000], desktop: [1440, 900] };
let frameWidth = 'desktop';
let frameDark = false;
const frameState = {};
const slugOf = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const cssValue = v => String(v ?? '').replace(/[<>{};"]/g, '');
const arr = x => (Array.isArray(x) ? x : []);
function tokenCss(p, dark) {
  const t = p.tokens || {};
  const colors = new Map(arr(t.color).map(c => [slugOf(c.name), c.value]));
  if (dark) for (const c of arr(t.dark)) colors.set(slugOf(c.name), c.value);
  const type = t.type || {};
  const vars = [
    ...[...colors].map(([n, v]) => `--color-${n}: ${cssValue(v)};`),
    ...arr(type.families).map(f => `--font-${slugOf(String(f.role || '').split(/\s+/)[0])}: "${cssValue(f.name)}", system-ui, sans-serif;`),
    ...arr(type.scale).flatMap(x => [`--size-${slugOf(x.name)}: ${cssValue(x.size)};`, `--leading-${slugOf(x.name)}: ${cssValue(x.lineHeight)};`, `--weight-${slugOf(x.name)}: ${cssValue(x.weight)};`]),
    ...arr(t.space).map((v, i) => `--space-${i + 1}: ${cssValue(v)};`),
    ...arr(t.radius).map(r => `--radius-${slugOf(r.name)}: ${cssValue(r.value)};`),
    ...arr(t.shadow).map(r => `--shadow-${slugOf(r.name)}: ${cssValue(r.value)};`),
    ...Object.entries(t.motion || {}).map(([k, v]) => `--motion-${slugOf(k)}: ${cssValue(v)};`),
  ];
  return `:root{${vars.join('')}color-scheme:${dark ? 'dark' : 'light'}}` +
    'body{margin:0;background:var(--color-bg,Canvas);color:var(--color-text,CanvasText);font-family:var(--font-body,system-ui)}';
}
const fontLinks = p => arr(((p.tokens || {}).type || {}).families).filter(f => f.source === 'google' && f.name)
  .map(f => `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${encodeURIComponent(f.name).replace(/%20/g, '+')}${
    arr(f.weights).length ? ':wght@' + arr(f.weights).map(Number).filter(Boolean).sort((a, b) => a - b).join(';') : ''}&display=swap">`).join('');
const frameDoc = (p, html, tokens = true) => '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
  (tokens ? `${fontLinks(p)}<style>${tokenCss(p, frameDark)}</style>` : '') + `</head><body>${html || ''}</body></html>`;
const frame = (doc, label, size = frameWidth) => `<div class="frame" data-size="${size}"><iframe sandbox title="${esc(label)}" srcdoc="${esc(doc)}"></iframe></div>`;
// Frames render at the real device width, scaled down to fit the column.
function fitFrames() {
  for (const box of app.querySelectorAll('.frame')) {
    const [w, h] = WIDTHS[box.dataset.size] || WIDTHS.desktop;
    const avail = box.parentElement.clientWidth;
    if (!avail) continue;
    const scale = Math.min(1, avail / w);
    Object.assign(box.firstElementChild.style, { width: `${w}px`, height: `${h}px`, transform: `scale(${scale})` });
    Object.assign(box.style, { width: `${Math.floor(w * scale)}px`, height: `${Math.round(h * scale)}px` });
  }
}
addEventListener('resize', fitFrames);
function luminance(hex) {
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return null;
  const h = m[1].length === 3 ? [...m[1]].map(c => c + c).join('') : m[1];
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const contrast = (a, b) => {
  const x = luminance(a), y = luminance(b);
  return x === null || y === null ? null : (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
};
// An existing screen also shows how it looks now, as the first button.
function screenHtml(p, sc, ask) {
  const states = [...(sc.current ? ['now'] : []), ...(arr(sc.states).length ? sc.states : ['default'])];
  const cur = states.includes(frameState[sc.id]) ? frameState[sc.id] : states[sc.current ? 1 : 0] || states[0];
  const cid = 'screen' + String(sc.id || '').replace(/[^A-Za-z0-9]/g, '');
  const html = cur === 'now' ? sc.current : sc.previews && sc.previews[cur];
  return `<div class="screen" id="${esc(sc.id)}">
    <h3>${esc(sc.id)} · ${txt(sc.name)} ${sc.mode ? `<span class="badge">${esc(sc.mode)}</span>` : ''} ${commentButton(cid, ask)}</h3>
    ${commentBox(cid, ask)}
    <p>${txt(sc.purpose)}${sc.data ? `<br><span class="muted">Data: ${txt(sc.data)}</span>` : ''}${sc.notes ? `<br><span class="muted">${txt(sc.notes)}</span>` : ''}</p>
    <div class="frames-bar" role="group" aria-label="${esc(sc.name)}: state">${states.map(st => `<button type="button" data-screen="${esc(sc.id)}" data-state="${esc(st)}" aria-pressed="${st === cur}">${
      st === 'now' ? 'Now' : esc(st)}${st === 'now' || (sc.previews && sc.previews[st]) ? '' : ' (no preview)'}</button>`).join('')}</div>
    ${html ? frame(frameDoc(p, html, cur !== 'now'), `${sc.name}, ${cur === 'now' ? 'as it is now' : cur}`) : '<p class="empty">No preview for this state yet.</p>'}
  </div>`;
}

// Which tab and phase are showing: a per-viewer convenience, so it lives in
// this browser only.
let activeTab = null;
let activePhase = null;
const uiKey = () => storeKey() + ':view';
function loadView() {
  try {
    const v = JSON.parse(localStorage.getItem(uiKey()) || 'null');
    if (v) { activeTab = v.tab || null; activePhase = Number.isInteger(v.phase) ? v.phase : null; }
  } catch { /* storage blocked: start from the defaults */ }
}
function saveView() {
  try { localStorage.setItem(uiKey(), JSON.stringify({ tab: activeTab, phase: activePhase })); } catch { /* same */ }
}

// Questions and decisions, grouped by the phase Claude gave each. Without
// one, questions and decisions each form a phase of their own.
function phasesOf(p) {
  const phases = [];
  const add = (kind, item, open) => {
    const title = String(item.phase || (kind === 'd' ? 'Decisions' : 'Questions'));
    let ph = phases.find(x => x.title === title);
    if (!ph) phases.push(ph = { title, items: [] });
    ph.items.push({ kind, item, open });
  };
  for (const q of Array.isArray(p.questions) ? p.questions : []) add('q', q, q.status !== 'answered');
  for (const d of Array.isArray(p.decisions) ? p.decisions : []) add('d', d, d.status !== 'decided');
  return phases;
}
const settled = it => !it.open || answered(draft.answers[it.item.id]);
const firstOpenPhase = phases => Math.max(0, phases.findIndex(ph => ph.items.some(it => !settled(it))));

function questionsTab(p, ask) {
  const phases = phasesOf(p);
  if (!phases.length) return '<section><p class="na">No questions yet.</p></section>';
  if (activePhase === null || activePhase >= phases.length) activePhase = firstOpenPhase(phases);
  const item = it => it.kind === 'q' ? question(it.item, ask) : decision(it.item, ask);
  const stepper = phases.map((ph, i) => {
    const open = ph.items.filter(it => it.open).map(it => it.item.id);
    return `<li><button type="button" class="phase${i === activePhase ? ' current' : ''}" data-phase="${i}"
      data-open="${esc(open.join(' '))}" data-total="${ph.items.length}" aria-current="${i === activePhase ? 'step' : 'false'}">
      <span class="num">${i + 1}</span><span>${esc(ph.title)}</span><span class="muted k"></span></button></li>`;
  }).join('');
  const panels = phases.map((ph, i) => {
    const open = ph.items.filter(it => it.open);
    const closed = ph.items.filter(it => !it.open);
    const prev = i > 0 ? `<button type="button" data-phase="${i - 1}">← ${esc(phases[i - 1].title)}</button>` : '<span></span>';
    const next = i < phases.length - 1 ? `<button type="button" class="primary" data-phase="${i + 1}">Next: ${esc(phases[i + 1].title)} →</button>`
      : ask ? '<span class="muted">Last phase. Send your answers with the bar below.</span>' : '<span></span>';
    return `<div data-phase-panel="${i}"${i === activePhase ? '' : ' hidden'}>
      <section><h2><span>${esc(ph.title)}</span><span class="muted">Phase ${i + 1} of ${phases.length}</span></h2>
        ${open.length ? open.map(item).join('') : '<p class="na">Nothing open in this phase.</p>'}
        ${closed.length ? `<details class="answered"><summary>Answered earlier (${closed.length})</summary>${closed.map(item).join('')}</details>` : ''}
        <div class="phase-nav">${prev}${next}</div>
      </section></div>`;
  }).join('');
  const recommend = ask && openItems(p).some(d => d.recommendation)
    ? '<p><button type="button" data-action="recommend">Use the recommendation wherever I haven’t answered</button></p>' : '';
  return `<ol class="phases" aria-label="Question phases">${stepper}</ol>${recommend}${panels}`;
}

const commentButton = (id, ask) => ask ? `<button type="button" class="link" data-toggle="${id}">Comment</button>` : '';
const commentBox = (id, ask) => ask ? `<textarea data-comment="${id}" rows="3" placeholder="Your comment on this section" aria-label="Comment on this section"${
  opened.has(id) || (draft.comments[id] || '').trim() ? '' : ' hidden'}></textarea>` : '';
const sectionHtml = (p, ask, id) => {
  const [, title, f] = SECTION[id];
  return `<section id="${id}"><h2><span>${title}</span>${commentButton(id, ask)}</h2>${commentBox(id, ask)}${present(p, id) ? f(p, ask) : empty}</section>`;
};

function overviewTop(p, ask) {
  const m = p.meta || {};
  const open = openItems(p);
  const phases = phasesOf(p);
  // Claude writes plan.js, so a risk marked as accepted is shown to the user
  // up front, to confirm it really was their call.
  const accepted = p.security && !isNa(p.security) && Array.isArray(p.security.threats)
    ? p.security.threats.filter(t => t.acceptedBy === 'user') : [];
  const steps = Array.isArray(p.steps) ? p.steps : [];
  const size = buildSize(p);
  const needs = Array.isArray(p.needsYou) ? p.needsYou.length : 0;
  const done = steps.filter(s => s.status === 'done').length;
  const toAnswer = open.filter(d => !answered(draft.answers[d.id])).length;
  const inPhases = phases.filter(ph => ph.items.some(it => !settled(it))).length;
  const waitingLine = toAnswer
    ? `${toAnswer} question${toAnswer > 1 ? 's' : ''} to answer, in ${inPhases} phase${inPhases > 1 ? 's' : ''}${open.length > toAnswer ? `; ${open.length - toAnswer} answered here, waiting to be sent or recorded` : ''}.`
    : `All ${open.length} answered here, waiting to be sent or recorded.`;
  return `
    ${open.length ? `<section class="waiting"><h2>Waiting on you</h2>
      <p>${waitingLine}
        ${ask ? 'Answer them in the Questions tab, then press <b>Send to Claude</b>. You can also answer in the terminal.'
          : m.status === 'draft' ? 'Answer them in the terminal, or ask Claude for the live page link to answer here.' : ''}</p>
      <p><button type="button" class="primary" data-tab="questions">Go to the questions →</button></p></section>`
    : ask ? `<section><h2>Ready for your review</h2><p>Read the plan, tab by tab. To change anything, comment on a section and send it to Claude.
      When you're happy, type <code>/naqsha:approve</code> in Claude Code. Approval is only that command.</p></section>` : ''}
    ${accepted.length && m.status === 'draft' ? `<section class="waiting"><h2>Risks marked as accepted by you</h2>
      <p>These threats will not be mitigated. Approving the plan accepts them. If one wasn't your decision, say so before you approve.</p>
      ${list(accepted, t => `<a href="#security">${esc(t.id)}</a> · ${txt(t.threat)}<br><span class="muted">Your reason: ${txt(t.acceptedReason)}</span>`)}</section>` : ''}
    <section>
      <h2>Build size</h2>
      <div class="stats">
        <div class="stat"><span class="muted">Steps</span><b>${size.steps}</b></div>
        <div class="stat"><span class="muted">Independent reviews</span><b>about ${size.reviewed}</b><span class="muted">plus the finish review</span></div>
        <div class="stat"><span class="muted">App runs</span><b>about ${size.runs}</b></div>
        <div class="stat"><span class="muted">Needs you</span><b>${needs ? `<a href="#needsYou">${needs} item${needs > 1 ? 's' : ''}</a>` : '—'}</b></div>
        <div class="stat"><span class="muted">Progress</span><b>${done} / ${steps.length} steps</b><div class="bar"><i style="width:${steps.length ? (100 * done / steps.length) : 0}%"></i></div></div>
      </div>
      <p class="muted">Effort: ${esc(size.effort)}. Claude builds the code, so the size is counted in its work, not in developer hours; the calendar time that remains is what needs you.</p>
    </section>`;
}

function render(p) {
  const m = p.meta || {};
  const ask = asking(p);
  document.title = (m.title || 'Plan') + (m.kind === 'design' ? ' · design' : ' · plan');
  const tabs = (m.kind === 'design' ? DESIGN_TABS : TABS).filter(([id]) => id !== 'questions' || phasesOf(p).length);
  if (!tabs.some(([id]) => id === activeTab)) {
    activeTab = openItems(p).length && tabs.some(([id]) => id === 'questions') ? 'questions' : 'overview';
  }
  const bar = tabs.map(([id, title, secs]) => `<button type="button" role="tab" id="tab-${id}" data-tab="${id}"
    aria-controls="panel-${id}" aria-selected="${id === activeTab}" tabindex="${id === activeTab ? 0 : -1}"
    class="${secs.some(x => !present(p, x)) ? 'todo' : ''}"${secs.some(x => !present(p, x)) ? ' title="Has sections not written yet"' : ''}>${title}${
    id === 'questions' ? ' <span class="count-badge" id="open-count"></span>' : ''}</button>`).join('');
  const panels = tabs.map(([id, , secs]) => `<div role="tabpanel" id="panel-${id}" aria-labelledby="tab-${id}"${id === activeTab ? '' : ' hidden'}>
    ${id === 'overview' ? overviewTop(p, ask) : ''}
    ${id === 'questions' ? questionsTab(p, ask) : secs.map(x => sectionHtml(p, ask, x)).join('')}</div>`).join('');

  app.innerHTML = `
    <header>
      <h1>${txt(m.title || 'Untitled plan')}</h1>
      <div class="meta">
        ${badge(m.status)}
        <span>${m.kind === 'new-app' ? 'New app' : m.kind === 'design' ? `Design${m.approach ? ` · ${esc(m.approach)}` : ''}` : 'Feature'}</span>
        ${m.updated ? `<span>Updated ${esc(m.updated)}</span>` : ''}
        ${m.approvedAt ? `<span>Approved ${esc(m.approvedAt.slice(0, 10))}</span>` : ''}
        ${m.research && m.research !== 'full' ? `<span class="s-blocked">Research ${txt(m.research)}</span>` : ''}
      </div>
    </header>
    <div class="tabs" role="tablist" aria-label="Plan sections">${bar}</div>
    ${panels}
    ${ask ? `<div class="sendbar" role="region" aria-label="Send to Claude">
      <span class="count" id="count"></span>
      <input type="text" id="message" placeholder="Message to Claude (optional)" aria-label="Message to Claude">
      <button type="button" class="primary" data-action="send">Send to Claude</button>
      <span class="status${status.bad ? ' bad' : ''}" id="status" role="status">${esc(status.text)}</span>
    </div>` : ''}
    <footer>Rendered from plan.js · refreshes when the file changes</footer>`;
  restore();
  drawDiagrams();
  fitFrames();
}

// Switching tabs and phases only flips visibility, so nothing typed is lost.
function setTab(id, focus = false) {
  const tab = app.querySelector(`[role=tab][data-tab="${CSS.escape(id)}"]`);
  if (!tab) return;
  activeTab = id;
  saveView();
  for (const t of app.querySelectorAll('[role=tab]')) {
    const on = t === tab;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
  }
  for (const panel of app.querySelectorAll('[role=tabpanel]')) panel.hidden = panel.id !== `panel-${id}`;
  if (focus) tab.focus();
  drawDiagrams();
  fitFrames();
}

function setPhase(i) {
  activePhase = i;
  saveView();
  for (const panel of app.querySelectorAll('[data-phase-panel]')) panel.hidden = Number(panel.dataset.phasePanel) !== i;
  for (const b of app.querySelectorAll('.phase[data-phase]')) {
    const on = Number(b.dataset.phase) === i;
    b.classList.toggle('current', on);
    b.setAttribute('aria-current', on ? 'step' : 'false');
  }
  const top = app.querySelector('.phases');
  if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView({ block: 'start' });
}

// A link to anything on the page opens the tab and phase it lives in.
function goTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const panel = el.closest('[role=tabpanel]');
  if (panel) setTab(panel.id.slice('panel-'.length));
  const phase = el.closest('[data-phase-panel]');
  if (phase) setPhase(Number(phase.dataset.phasePanel));
  const folded = el.closest('details');
  if (folded) folded.open = true;
  el.scrollIntoView({ block: 'start' });
}

// Puts the draft back into the freshly rendered inputs.
function restore() {
  for (const el of app.querySelectorAll('[data-id]')) {
    const a = draft.answers[el.dataset.id];
    if (el.dataset.f === 'choice') el.checked = !!a && a.choice.includes(el.value);
    else el.value = (a && a[el.dataset.f]) || '';
  }
  for (const el of app.querySelectorAll('[data-comment]')) el.value = draft.comments[el.dataset.comment] || '';
  for (const el of app.querySelectorAll('[data-sent]')) {
    let a = null;
    try { a = JSON.parse(draft.sent[el.dataset.sent]); } catch { /* nothing sent */ }
    el.textContent = a ? `Sent: ${answerText(a)}. Waiting for Claude to record it.` : '';
  }
  const msg = document.getElementById('message');
  if (msg) msg.value = draft.message;
  updateBar();
}

function updateBar() {
  const count = document.getElementById('count');
  if (!plan) return;
  if (!count) return updatePhases();
  const open = openItems(plan);
  const done = open.filter(d => answered(draft.answers[d.id])).length;
  const comments = Object.values(draft.comments).filter(t => t.trim()).length;
  updatePhases();
  count.textContent = [open.length ? `${done} of ${open.length} answered` : '', comments ? `${comments} comment${comments > 1 ? 's' : ''}` : '']
    .filter(Boolean).join(' · ') || 'Nothing to send yet';
  app.querySelector('[data-action="send"]').disabled = toSend().nothing;
}

// Answered counts in the phase stepper and the Questions tab, as you type.
function updatePhases() {
  let waiting = 0;
  for (const b of app.querySelectorAll('.phase[data-open]')) {
    const open = b.dataset.open.split(' ').filter(Boolean);
    const total = Number(b.dataset.total);
    const k = total - open.length + open.filter(id => answered(draft.answers[id])).length;
    waiting += total - k;
    b.querySelector('.k').textContent = `${k}/${total}`;
    b.classList.toggle('complete', k === total);
    b.querySelector('.num').textContent = k === total ? '✓' : String(Number(b.dataset.phase) + 1);
  }
  const badge = document.getElementById('open-count');
  if (badge) badge.textContent = waiting ? String(waiting) : '';
}

function toSend() {
  const ids = new Set(openItems(plan).map(d => d.id));
  const answers = Object.entries(draft.answers).filter(([id, a]) => ids.has(id) && unsent(id, a)).map(([id, a]) => ({ id, ...a }));
  const comments = Object.entries(draft.comments).filter(([, t]) => t.trim()).map(([section, text]) => ({ section, text }));
  const message = draft.message.trim();
  return { answers, comments, message, nothing: !answers.length && !comments.length && !message };
}

function setStatus(text, bad = false) {
  status = { text, bad };
  const el = document.getElementById('status');
  if (el) { el.textContent = text; el.className = 'status' + (bad ? ' bad' : ''); }
}

async function send() {
  const out = toSend();
  if (out.nothing) return;
  setStatus('Sending…');
  try {
    const r = await fetch('submit?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: out.answers, comments: out.comments, message: out.message }),
    });
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    setStatus(`Not sent: ${e.message === 'Failed to fetch' || e.name === 'TypeError' ? 'the page server isn’t running' : e.message}. ` +
      'Everything you wrote is kept here. Ask Claude to restart the page, then send again.', true);
    return;
  }
  for (const a of out.answers) draft.sent[a.id] = JSON.stringify({ choice: a.choice, text: a.text, note: a.note });
  draft.comments = {};
  draft.message = '';
  opened.clear();
  saveDraft();
  setStatus(`Sent at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}. Claude is updating the plan; this page follows along.`);
  render(plan);
}

function useRecommendations() {
  for (const d of openItems(plan)) {
    if (d.recommendation && !answered(draft.answers[d.id])) {
      draft.answers[d.id] = { choice: [d.recommendation], text: '', note: (draft.answers[d.id] || {}).note || '' };
    }
  }
  saveDraft();
  restore();
}

function onInput(e) {
  const el = e.target;
  if (el.dataset.comment) {
    draft.comments[el.dataset.comment] = el.value;
  } else if (el.dataset.id) {
    const a = draft.answers[el.dataset.id] || (draft.answers[el.dataset.id] = { choice: [], text: '', note: '' });
    if (el.dataset.f === 'choice') a.choice = [...app.querySelectorAll(`input[name="${CSS.escape(el.name)}"]:checked`)].map(i => i.value);
    else a[el.dataset.f] = el.value;
  } else if (el.id === 'message') {
    draft.message = el.value;
  } else return;
  saveDraft();
  updateBar();
}

app.addEventListener('input', onInput);
app.addEventListener('change', onInput);
app.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#"]');
  if (link) {
    e.preventDefault();
    goTo(decodeURIComponent(link.getAttribute('href').slice(1)));
    return;
  }
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) setTab(t.dataset.tab);
  else if (t.dataset.width || t.dataset.dark || t.dataset.state) {
    if (t.dataset.width) frameWidth = t.dataset.width;
    else if (t.dataset.dark) frameDark = !frameDark;
    else frameState[t.dataset.screen] = t.dataset.state;
    const y = scrollY;
    render(plan);
    scrollTo(0, y);
  }
  else if (t.dataset.phase !== undefined) setPhase(Number(t.dataset.phase));
  else if (t.dataset.action === 'send') send();
  else if (t.dataset.action === 'recommend') useRecommendations();
  else if (t.dataset.toggle) {
    const box = app.querySelector(`[data-comment="${CSS.escape(t.dataset.toggle)}"]`);
    box.hidden = !box.hidden;
    if (box.hidden) opened.delete(t.dataset.toggle); else { opened.add(t.dataset.toggle); box.focus(); }
  }
});
// Arrow keys, Home and End move between tabs (the WAI-ARIA tabs pattern).
app.addEventListener('keydown', e => {
  const t = e.target.closest('[role=tab]');
  if (!t || !['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  const tabs = [...app.querySelectorAll('[role=tab]')];
  const i = tabs.indexOf(t);
  const j = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
  e.preventDefault();
  setTab(tabs[j].dataset.tab, true);
});
// Never re-render under someone typing; catch up when they leave the field.
app.addEventListener('focusout', () => setTimeout(() => { if (pending) show(pending); }, 0));

function show(p) {
  const a = document.activeElement;
  if (a && app.contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type === 'text'))) { pending = p; return; }
  pending = null;
  const first = !plan;
  plan = p;
  if (first) { loadDraft(); loadView(); }
  // Forget drafts for questions Claude has recorded.
  const ids = new Set(openItems(p).map(d => d.id));
  for (const id of Object.keys(draft.answers)) if (!ids.has(id)) delete draft.answers[id];
  for (const id of Object.keys(draft.sent)) if (!ids.has(id)) delete draft.sent[id];
  saveDraft();
  const y = scrollY;
  render(p);
  scrollTo(0, y);
}

// Fetched once, as soon as the plan has a diagram anywhere, so a tab with
// one draws without waiting on the CDN.
let mermaidLoad = null;
const loadMermaid = () => mermaidLoad || (mermaidLoad = import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs').then(m => {
  m.default.initialize({ startOnLoad: false, securityLevel: 'strict', theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
  return m.default;
}));
async function drawDiagrams() {
  const all = [...document.querySelectorAll('[data-mermaid]')];
  if (!all.length) return;
  const els = all.filter(el => !el.closest('[hidden]') && !el.querySelector('svg'));
  try {
    const mermaid = await loadMermaid();
    for (const [i, el] of els.entries()) {
      const { svg } = await mermaid.render('mmd' + i + Date.now(), el.dataset.mermaid);
      el.innerHTML = svg;
    }
  } catch { /* offline or invalid diagram: the source stays visible */ }
}

// file:// pages can't fetch(), but they can load a script, so poll by reloading plan.js.
let reachable = true;
function load() {
  const s = document.createElement('script');
  s.src = 'plan.js?t=' + Date.now() + (KEY ? '&key=' + encodeURIComponent(KEY) : '');
  s.onload = s.onerror = e => {
    s.remove();
    if (LIVE && (e.type === 'error') === reachable) {
      reachable = e.type !== 'error';
      if (!reachable) setStatus('Can’t reach the page server. Keep writing; it’s saved here. Ask Claude to restart the page before you send.', true);
      else if (status.bad) setStatus('');
    }
    const p = window.NAQSHA;
    const now = p ? JSON.stringify(p) : '';
    if (now && now !== last) {
      last = now;
      show(p);
    }
  };
  document.head.appendChild(s);
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
