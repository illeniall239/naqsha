<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
:root {
  --paper: #f6f4ee; --surface: #fffdf9; --sunken: #efece5; --ink: #1c1b18; --ink-2: #57534b; --ink-3: #8b877d;
  --rule: #e4e0d6; --rule-2: #d3cdc0;
  --accent: #2447c9; --accent-soft: #e8ecfa; --on-accent: #ffffff;
  --ok: #1b7445; --ok-soft: #e2f0e6; --warn: #985600; --warn-soft: #fbefda; --bad: #b3241b; --bad-soft: #f9e4e1;
  --grid: rgba(36, 71, 201, .07); --shadow: 0 1px 2px rgba(28, 27, 24, .05), 0 6px 20px rgba(28, 27, 24, .06);
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
code { font: .84em var(--mono); background: var(--sunken); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { font: .82rem/1.55 var(--mono); background: var(--sunken); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font: 500 .72rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.lbl { font: 600 .7rem var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.empty { color: var(--ink-2); font-style: italic; }

/* ---- masthead ---- */
.masthead { border-bottom: 1px solid var(--rule); background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, var(--surface); }
.masthead .in { max-width: 1240px; margin: 0 auto; padding: 30px 24px 26px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 48px; align-items: end; }
.masthead h1 { font: 600 2.2rem/1.15 var(--serif); letter-spacing: -.01em; margin: 8px 0 12px; max-width: 34ch; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--ink-2); font-size: .86rem; }
.meta .sep { color: var(--rule-2); }
.intro { font: 400 1.08rem/1.6 var(--serif); color: var(--ink-2); max-width: 72ch; margin-top: 14px; }
.intro p { margin: 0 0 8px; }
.progress-box { min-width: 240px; }
.progress-box .nums { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.progress-box .nums b { font: 600 1.5rem/1 var(--serif); }
.segbar { display: flex; gap: 3px; height: 8px; }
.segbar span { flex: 1; border-radius: 2px; background: var(--rule); }
.segbar span.read { background: var(--ok); }

/* ---- layout ---- */
.shell { max-width: 1240px; margin: 0 auto; padding: 0 24px 100px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 52px; }
.toc { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 26px 0; display: grid; gap: 1px; }
.toc .grp { margin: 14px 0 6px 10px; }
.toc .grp:first-child { margin-top: 0; }
.toc button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; font: 500 .9rem/1.35 var(--sans); padding: 7px 10px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); cursor: pointer; }
.toc button:hover { background: var(--sunken); color: var(--ink); }
.toc button[aria-current=page] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.toc .mark { flex: none; width: 1.7em; font: 500 .72rem var(--mono); color: var(--ink-3); }
.toc .mark.read { color: var(--ok); font-weight: 600; }
.content { padding-top: 34px; min-width: 0; }
article { max-width: 760px; }

/* ---- chapter ---- */
.ch-h h2 { font: 600 2.1rem/1.15 var(--serif); letter-spacing: -.01em; margin: 8px 0 14px; text-wrap: balance; }
.lede { font: italic 400 1.28rem/1.5 var(--serif); color: var(--ink); margin: 0 0 28px; padding-left: 16px; border-left: 3px solid var(--accent); }
.prose { font: 400 1.1rem/1.7 var(--serif); }
.prose p { margin: 0 0 16px; }
.prose ul { margin: 0 0 16px; padding-left: 22px; }
.prose li { margin: 6px 0; }
.prose li::marker { color: var(--ink-3); }
.prose code { font-size: .78em; }
.block { margin-top: 38px; }
.block > .lbl { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.block > .lbl::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
figure.diagram { margin: 28px 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; overflow-x: auto; }
figure.diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
figure.diagram pre { background: none; padding: 0; margin: 0; }
.why { display: grid; gap: 8px; }
.why .item { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; }
.why .item.unknown { border-style: dashed; }
.src { display: inline-block; font: 500 .72rem/1.5 var(--mono); padding: 1px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; text-decoration: none; max-width: 22em; overflow: hidden; text-overflow: ellipsis; }
.src.unknown { background: var(--warn-soft); color: var(--warn); }
.files { border-top: 1px solid var(--rule); }
.files .f { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 4px 18px; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.path { font: .8rem/1.5 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.path .ln { color: var(--accent); }
.tasks { list-style: none; padding: 0; margin: 0; counter-reset: t; display: grid; gap: 8px; }
.tasks li { counter-increment: t; position: relative; padding: 12px 14px 12px 50px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.tasks li::before { content: counter(t); position: absolute; left: 14px; top: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 600 .75rem/24px var(--mono); text-align: center; }
.cards-q { display: grid; gap: 8px; }
details.check { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
details.check > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; gap: 12px; align-items: baseline; font: 500 1.02rem/1.4 var(--serif); }
details.check > summary::-webkit-details-marker { display: none; }
details.check > summary .q { color: var(--accent); font: 600 .74rem var(--mono); }
details.check > summary .reveal { margin-left: auto; font: 500 .78rem var(--sans); color: var(--accent); white-space: nowrap; }
details.check[open] > summary .reveal { color: var(--ink-3); }
details.check .a { padding: 0 16px 14px 16px; border-top: 1px dashed var(--rule); padding-top: 12px; font-size: 1rem; }
details.check .a p { margin: 0 0 10px; }
details.check .a p:last-child { margin: 0; }
.ask { margin-top: 38px; padding: 16px; border-radius: 12px; background: var(--accent-soft); }
.ask p { margin: 0; font-size: .9rem; }
.ask .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 44px; }
.nav .go { display: block; text-align: left; font: inherit; padding: 14px 16px; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface); color: var(--ink); cursor: pointer; }
.nav .go:hover { border-color: var(--ink-3); }
.nav .go.next { text-align: right; grid-column: 2; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.nav .go.next .lbl { color: inherit; opacity: .65; }
.nav .go b { display: block; font: 600 1.05rem/1.35 var(--serif); margin-top: 3px; }
.filter { display: block; width: 100%; font: .95rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; padding: 9px 12px; margin-bottom: 14px; }
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.gloss .g { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.gloss .g b { display: block; font: 600 1.02rem/1.3 var(--serif); margin-bottom: 4px; }
.gloss .g span { font-size: .9rem; color: var(--ink-2); }
button.btn { font: 500 .88rem var(--sans); padding: 7px 14px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); cursor: pointer; }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
textarea { display: block; width: 100%; font: .95rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; padding: 8px 10px; resize: vertical; margin-top: 8px; }
.status { font-size: .85rem; color: var(--ink-2); }
.status.bad { color: var(--bad); }
footer { color: var(--ink-3); font: .78rem var(--mono); margin-top: 40px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 16px 80px; }
  .toc { min-width: 0; }
  .meta .sep { display: none; }
  .toc { position: sticky; top: 0; z-index: 3; max-height: none; display: flex; gap: 4px; overflow-x: auto; margin: 0 -16px; padding: 8px 16px; background: var(--paper); border-bottom: 1px solid var(--rule); }
  .toc .grp { display: none; }
  .toc button { width: auto; white-space: nowrap; }
  .masthead .in { grid-template-columns: 1fr; padding: 22px 16px 18px; }
  .masthead h1 { font-size: 1.75rem; }
  .progress-box { min-width: 0; }
  .content { padding-top: 22px; }
  .ch-h h2 { font-size: 1.65rem; }
  .prose { font-size: 1.05rem; }
}
@media (max-width: 560px) {
  .files .f { grid-template-columns: 1fr; }
  .why .item { grid-template-columns: 1fr; }
  .nav { grid-template-columns: 1fr; }
  .nav .go.next { grid-column: 1; }
}
@media print {
  .toc, .nav, .ask, footer, .filter { display: none; }
  .shell { display: block; }
  [data-view][hidden] { display: block !important; }
  details.check > .a { display: block; }
  details.check { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="app"><p class="empty" style="padding:24px">Loading guide.js…</p></div>
<script>
'use strict';
// The guide /naqsha:learn wrote: what was built, why, and where everything is.
// Read-only, except that when served live you can ask Claude about a chapter.
const app = document.getElementById('app');
const KEY = new URLSearchParams(location.search).get('key');
const LIVE = /^https?:$/.test(location.protocol) && !!KEY;
let guide = null;
let last = '';
let view = null;
let status = { text: '', bad: false };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Plain text with `code` spans; everything else stays escaped.
const txt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const arr = x => (Array.isArray(x) ? x : []);
// Paragraphs split on blank lines; a block whose lines all start with "- " is a list.
const prose = s => String(s || '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => {
  const lines = b.split('\n');
  return lines.every(l => /^\s*-\s/.test(l))
    ? `<ul>${lines.map(l => `<li>${txt(l.replace(/^\s*-\s/, ''))}</li>`).join('')}</ul>`
    : `<p>${txt(b).replace(/\n/g, '<br>')}</p>`;
}).join('');
const safeUrl = u => /^https?:\/\//i.test(u || '') ? esc(u) : null;
// Where a "why" comes from: an answer, a decision, research, or nothing recorded.
const KINDS = { SC: 'screen', Q: 'your answer', D: 'decision', N: 'quality scenario', T: 'threat', S: 'step', A: 'acceptance criterion', F: 'requirement' };
const unknown = s => { const v = String(s || '').trim(); return !v || /^not recorded$/i.test(v); };
function source(s) {
  const v = String(s || '').trim();
  if (unknown(v)) return '<span class="src unknown" title="No reason was recorded for this">reason not recorded</span>';
  const link = safeUrl(v);
  if (link) return `<a class="src" href="${link}" target="_blank" rel="noopener noreferrer" title="${link}">${esc(v.replace(/^https?:\/\/(www\.)?/, '').split('/')[0])} ↗</a>`;
  const id = /^(SC|[QDNTSAF])\d+$/.exec(v);
  return `<span class="src" title="${id ? esc(KINDS[id[1]]) : esc(v)}">${esc(v)}</span>`;
}

// ---- reading progress (this browser only) ----------------------------------

const storeKey = () => 'naqsha-learn:' + ((guide && guide.meta && (guide.meta.plan || guide.meta.title)) || location.pathname);
let read = new Set();
function loadProgress() {
  try {
    const v = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    if (v) { read = new Set(v.read || []); view = v.view || null; }
  } catch { /* storage blocked: progress lives in memory only */ }
}
function saveProgress() {
  try { localStorage.setItem(storeKey(), JSON.stringify({ read: [...read], view: view && view.id })); } catch { /* same */ }
}

// ---- views -----------------------------------------------------------------

function views(g) {
  return [
    ...arr(g.chapters).map((c, i) => ({ id: c.id || `C${i + 1}`, title: c.title, chapter: c, n: i + 1 })),
    ...(arr(g.map).length ? [{ id: 'map', title: 'Where everything is' }] : []),
    ...(arr(g.glossary).length ? [{ id: 'glossary', title: 'Glossary' }] : []),
  ];
}

function chapterHtml(c, n, total) {
  return `<header class="ch-h"><span class="eyebrow">Chapter ${n} of ${total}</span><h2>${txt(c.title)}</h2></header>
    ${c.summary ? `<p class="lede">${txt(c.summary)}</p>` : ''}
    <div class="prose">${prose(c.body)}</div>
    ${c.diagram ? `<figure class="diagram" data-mermaid="${esc(c.diagram)}"><pre>${esc(c.diagram)}</pre></figure>` : ''}
    ${arr(c.why).length ? `<section class="block"><div class="lbl">Why it’s this way</div><div class="why">${c.why.map(w =>
      `<div class="item${unknown(w.source) ? ' unknown' : ''}"><span>${txt(w.text)}</span>${source(w.source)}</div>`).join('')}</div></section>` : ''}
    ${arr(c.where).length ? `<section class="block"><div class="lbl">Where it lives</div><div class="files">${c.where.map(w =>
      `<div class="f"><span class="path">${esc(w.path)}${w.line ? `<span class="ln">:${esc(w.line)}</span>` : ''}</span><span>${txt(w.what)}</span></div>`).join('')}</div></section>` : ''}
    ${arr(c.try).length ? `<section class="block"><div class="lbl">Try it yourself</div><ol class="tasks">${c.try.map(t => `<li>${txt(t)}</li>`).join('')}</ol></section>` : ''}
    ${arr(c.check).length ? `<section class="block"><div class="lbl">Check yourself</div><div class="cards-q">${c.check.map((q, i) =>
      `<details class="check"><summary><span class="q">Q${i + 1}</span><span>${txt(q.q)}</span><span class="reveal">Show answer</span></summary><div class="a">${prose(q.a)}</div></details>`).join('')}</div></section>` : ''}`;
}

const filterBox = (id, label) => `<input type="search" class="filter" data-filter="${id}" placeholder="Filter ${label}" aria-label="Filter ${label}">`;

function viewHtml(g, v, all) {
  const i = all.indexOf(v);
  const chapters = all.filter(x => x.chapter).length;
  let body;
  if (v.chapter) body = chapterHtml(v.chapter, v.n, chapters);
  else if (v.id === 'map') body = `<header class="ch-h"><span class="eyebrow">Reference</span><h2>Where everything is</h2></header>
    <p class="lede">Every folder and file that matters, and what it’s for.</p>${filterBox('map', 'files')}
    <div class="files" data-rows="map">${arr(g.map).map(r => `<div class="f"><span class="path">${esc(r.path)}</span><span>${txt(r.what)}</span></div>`).join('')}</div>`;
  else body = `<header class="ch-h"><span class="eyebrow">Reference</span><h2>Glossary</h2></header>
    <p class="lede">The words this project uses, in plain language.</p>${filterBox('glossary', 'terms')}
    <div class="gloss" data-rows="glossary">${arr(g.glossary).map(r => `<div class="g"><b>${txt(r.term)}</b><span>${txt(r.meaning)}</span></div>`).join('')}</div>`;
  const prev = all[i - 1];
  const next = all[i + 1];
  return `<article data-view="${esc(v.id)}"${v === view ? '' : ' hidden'}>${body}
    ${LIVE && v.chapter ? `<div class="ask"><p>Something unclear? Ask Claude about this chapter; the answer comes in your terminal.</p>
      <textarea data-ask="${esc(v.id)}" rows="2" aria-label="Your question about this chapter"></textarea>
      <div class="row"><button type="button" class="btn primary" data-action="ask" data-chapter="${esc(v.id)}">Ask Claude</button>
      <span class="status${status.bad ? ' bad' : ''}" data-status="${esc(v.id)}"></span></div></div>` : ''}
    <div class="nav">${prev ? `<button type="button" class="go" data-go="${esc(prev.id)}"><span class="lbl">← Previous</span><b>${txt(prev.title)}</b></button>` : '<span></span>'}
      ${next ? `<button type="button" class="go next" data-go="${esc(next.id)}" data-read="${esc(v.id)}"><span class="lbl">Next →</span><b>${txt(next.title)}</b></button>`
        : `<button type="button" class="go next" data-read="${esc(v.id)}"><span class="lbl">Finished</span><b>Mark as read</b></button>`}</div></article>`;
}

function render(g) {
  const m = g.meta || {};
  document.title = `Learn · ${m.title || 'project'}`;
  const all = views(g);
  if (!all.length) { app.innerHTML = '<p class="empty" style="padding:24px">The guide has no chapters yet.</p>'; return; }
  view = all.find(v => v.id === (view && view.id ? view.id : view)) || all[0];
  const chapters = all.filter(v => v.chapter);
  const done = chapters.filter(v => read.has(v.id)).length;
  const meta = [m.scope && txt(m.scope), m.audience && `Written for: ${txt(m.audience)}`,
    m.commit && `Code as of <code>${esc(String(m.commit).slice(0, 10))}</code>`, m.generated && `Written ${esc(m.generated)}`].filter(Boolean);
  app.innerHTML = `
    <header class="masthead"><div class="in"><div>
      <span class="eyebrow">naqsha · learn</span>
      <h1>${txt(m.title || 'This project')}</h1>
      <div class="meta">${meta.map((x, i) => `${i ? '<span class="sep">/</span>' : ''}<span>${x}</span>`).join('')}</div>
      ${g.intro ? `<div class="intro">${prose(g.intro)}</div>` : ''}
    </div>
    <div class="progress-box"><div class="nums"><span class="eyebrow">Reading</span><span><b id="done">${done}</b> <span style="color:var(--ink-2)">/ ${chapters.length} chapters</span></span></div>
      <div class="segbar">${chapters.map(v => `<span data-seg="${esc(v.id)}" class="${read.has(v.id) ? 'read' : ''}" title="${esc(v.title)}"></span>`).join('')}</div></div>
    </div></header>
    <div class="shell">
      <nav class="toc" aria-label="Chapters">
        <span class="grp lbl">Chapters</span>
        ${all.map((v, i) => `${!v.chapter && all[i - 1] && all[i - 1].chapter ? '<span class="grp lbl">Reference</span>' : ''}<button type="button" data-go="${esc(v.id)}"${v === view ? ' aria-current="page"' : ''}>
          <span class="mark${read.has(v.id) ? ' read' : ''}">${v.chapter ? (read.has(v.id) ? '✓' : String(v.n).padStart(2, '0')) : '—'}</span><span>${txt(v.title)}</span></button>`).join('')}
      </nav>
      <main class="content">${all.map(v => viewHtml(g, v, all)).join('')}
        <footer>Rendered from guide.js · run /naqsha:learn again after the code changes</footer></main>
    </div>`;
  drawDiagrams();
}

function go(id) {
  const all = views(guide);
  const v = all.find(x => x.id === id);
  if (!v) return;
  view = v;
  saveProgress();
  for (const a of app.querySelectorAll('[data-view]')) a.hidden = a.dataset.view !== id;
  for (const b of app.querySelectorAll('.toc button')) {
    if (b.dataset.go === id) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  app.querySelector('.shell').scrollIntoView({ block: 'start' });
  drawDiagrams();
}

function markRead(id) {
  read.add(id);
  saveProgress();
  const chapters = views(guide).filter(v => v.chapter);
  for (const b of app.querySelectorAll('.toc button')) {
    if (b.dataset.go !== id) continue;
    const mark = b.querySelector('.mark');
    mark.classList.add('read');
    if (chapters.some(v => v.id === id)) mark.textContent = '✓';
  }
  const seg = app.querySelector(`[data-seg="${CSS.escape(id)}"]`);
  if (seg) seg.classList.add('read');
  app.querySelector('#done').textContent = chapters.filter(v => read.has(v.id)).length;
}

async function ask(id) {
  const box = app.querySelector(`[data-ask="${CSS.escape(id)}"]`);
  const out = app.querySelector(`[data-status="${CSS.escape(id)}"]`);
  const question = box.value.trim();
  if (!question) return;
  const chapter = views(guide).find(v => v.id === id);
  out.textContent = 'Sending…';
  out.className = 'status';
  try {
    const r = await fetch('submit?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `[Learn · ${id} ${chapter ? chapter.title : ''}] ${question}` }),
    });
    if (!r.ok) throw new Error(await r.text());
    box.value = '';
    out.textContent = 'Sent. Claude answers in your terminal.';
  } catch (e) {
    out.textContent = `Not sent: ${e.name === 'TypeError' ? 'the page server isn’t running' : e.message}. Ask in the terminal instead.`;
    out.className = 'status bad';
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.read) markRead(b.dataset.read);
  if (b.dataset.go) go(b.dataset.go);
  if (b.dataset.action === 'ask') ask(b.dataset.chapter);
});
app.addEventListener('input', e => {
  const f = e.target.dataset.filter;
  if (!f) return;
  const q = e.target.value.trim().toLowerCase();
  for (const row of app.querySelectorAll(`[data-rows="${CSS.escape(f)}"] > *`)) row.hidden = q !== '' && !row.textContent.toLowerCase().includes(q);
});

// Fetched once, as soon as the guide has a diagram anywhere.
let mermaidLoad = null;
const loadMermaid = () => mermaidLoad || (mermaidLoad = import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs').then(m => {
  m.default.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base', fontFamily: 'IBM Plex Sans, system-ui, sans-serif',
    themeVariables: { background: '#fffdf9', primaryColor: '#e8ecfa', primaryBorderColor: '#2447c9', primaryTextColor: '#1c1b18', lineColor: '#8b877d', secondaryColor: '#efece5', tertiaryColor: '#fffdf9', fontSize: '14px' } });
  return m.default;
}));
async function drawDiagrams() {
  const all = [...document.querySelectorAll('[data-mermaid]')];
  if (!all.length) return;
  const els = all.filter(el => !el.closest('[hidden]') && !el.querySelector('svg'));
  try {
    const mermaid = await loadMermaid();
    for (const [i, el] of els.entries()) {
      const { svg } = await mermaid.render('mmd' + i + Date.now(), el.dataset.mermaid);
      el.innerHTML = svg;
    }
  } catch { /* offline or invalid diagram: the source stays visible */ }
}

// file:// pages can't fetch(), but they can load a script, so poll guide.js.
function load() {
  const s = document.createElement('script');
  s.src = 'guide.js?t=' + Date.now() + (KEY ? '&key=' + encodeURIComponent(KEY) : '');
  s.onload = s.onerror = () => {
    s.remove();
    const g = window.NAQSHA_GUIDE;
    const now = g ? JSON.stringify(g) : '';
    if (!now || now === last) return;
    const first = !guide;
    last = now;
    guide = g;
    if (first) loadProgress();
    // Don't redraw under someone typing a question; the next poll catches up.
    if (document.activeElement && document.activeElement.matches('textarea, input')) { last = ''; return; }
    const y = scrollY;
    render(g);
    scrollTo(0, y);
  };
  document.head.appendChild(s);
}
load();
setInterval(load, 3000);
</script>
