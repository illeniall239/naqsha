<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
:root {
  --paper: #f6f4ee; --surface: #fffdf9; --sunken: #efece5; --ink: #1c1b18; --ink-2: #57534b; --ink-3: #8b877d;
  --rule: #e4e0d6; --rule-2: #d3cdc0;
  --accent: #2447c9; --accent-soft: #e8ecfa; --on-accent: #ffffff;
  --ok: #1b7445; --ok-soft: #e2f0e6; --warn: #985600; --warn-soft: #fbefda; --bad: #b3241b; --bad-soft: #f9e4e1;
  --grid: rgba(36, 71, 201, .07); --shadow: 0 1px 2px rgba(28, 27, 24, .05), 0 6px 20px rgba(28, 27, 24, .06);
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 16px; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
code { font: .86em var(--mono); background: var(--sunken); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { font: .82rem/1.55 var(--mono); background: var(--sunken); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0; }
ul, ol { margin: 0; padding-left: 20px; }
li { margin: 3px 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .85rem; }
.na { color: var(--ink-2); font-style: italic; }
.empty { color: var(--warn); font-style: italic; }

/* ---- masthead ---- */
.masthead { border-bottom: 1px solid var(--rule); background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, var(--surface); }
.masthead .in { max-width: 1280px; margin: 0 auto; padding: 28px 24px 22px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 40px; align-items: end; }
.eyebrow { font: 500 .72rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.masthead h1 { font: 600 2.15rem/1.15 var(--serif); letter-spacing: -.01em; margin: 8px 0 12px; max-width: 42ch; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--ink-2); font-size: .86rem; }
.meta .sep { color: var(--rule-2); }
.progress-box { min-width: 260px; }
.progress-box .nums { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.progress-box .nums b { font: 600 1.5rem/1 var(--serif); }
.segbar { display: flex; gap: 3px; height: 8px; }
.segbar .seg { flex: 1; border-radius: 2px; background: var(--rule); }
.seg.st-done { background: var(--ok); }
.seg.st-doing { background: var(--accent); }
.seg.st-blocked { background: var(--bad); }

/* ---- shell ---- */
.shell { max-width: 1280px; margin: 0 auto; padding: 0 24px 120px; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 48px; }
.rail { position: sticky; top: 0; align-self: start; max-height: 100vh; overflow-y: auto; padding: 24px 0; }
.rail [role=tablist] { display: grid; gap: 1px; }
.rail [role=tab] { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: 500 .92rem/1.3 var(--sans); padding: 8px 10px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); cursor: pointer; }
.rail [role=tab]:hover { background: var(--sunken); color: var(--ink); }
.rail [role=tab][aria-selected=true] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.rail [role=tab] .n { font: 500 .7rem var(--mono); color: var(--ink-3); width: 1.6em; }
.rail [role=tab].todo .n::after { content: ''; display: inline-block; width: 5px; height: 5px; margin-left: 3px; border-radius: 50%; background: var(--warn); vertical-align: middle; }
.count-badge { margin-left: auto; min-width: 1.6em; padding: 1px 6px; border-radius: 999px; background: var(--warn); color: var(--surface); font: 600 .72rem/1.4 var(--sans); text-align: center; }
.count-badge:empty { display: none; }
.sub { list-style: none; margin: 2px 0 8px; padding: 0 0 0 28px; border-left: 0; }
.sub li { margin: 0; }
.sub a { display: block; padding: 3px 8px; font-size: .84rem; color: var(--ink-3); text-decoration: none; border-left: 1px solid var(--rule); }
.sub a:hover { color: var(--ink); border-left-color: var(--ink-3); }
.content { padding-top: 28px; min-width: 0; max-width: 940px; }

/* ---- sections ---- */
.sec { padding: 4px 0 34px; margin-bottom: 30px; border-bottom: 1px solid var(--rule); scroll-margin-top: 16px; }
.sec:last-child { border-bottom: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; }
.sec-h h2 { font: 600 1.55rem/1.2 var(--serif); margin: 0; letter-spacing: -.005em; }
.sec-h .count { font: 500 .78rem var(--mono); color: var(--ink-3); margin-left: 8px; }
h3 { font: 600 .74rem/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 26px 0 10px; }
h3:first-child { margin-top: 0; }
.prose { max-width: 70ch; }

/* ---- building blocks ---- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; align-items: start; }
.cards.two { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
.card-h { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-bottom: 8px; }
.card-h .title { font-weight: 600; flex: 1 1 auto; min-width: 0; }
.card .foot { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--rule); font-size: .84rem; color: var(--ink-2); }
.rows { border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; padding: 10px 2px; border-bottom: 1px solid var(--rule); align-items: baseline; }
.row.noid { grid-template-columns: minmax(0, 1fr) auto; }
.row .sub2 { grid-column: 2 / -1; font-size: .85rem; color: var(--ink-2); }
.row.noid .sub2 { grid-column: 1 / -1; }
.id { display: inline-block; font: 500 .74rem/1.5 var(--mono); padding: 0 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.ref { font: 500 .8em/1 var(--mono); padding: 1px 4px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); text-decoration: none; white-space: nowrap; }
a.ref:hover, a.id:hover { background: var(--accent); color: var(--on-accent); }
.tag { display: inline-block; font: 500 .74rem/1.55 var(--sans); padding: 0 7px; border-radius: 5px; background: var(--sunken); color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 .72rem/1.6 var(--sans); padding: 0 8px; border-radius: 999px; white-space: nowrap; background: var(--sunken); color: var(--ink-2); }
.pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.plain::before { display: none; }
.st-draft, .st-open, .st-todo { background: var(--warn-soft); color: var(--warn); }
.st-approved, .st-decided, .st-done, .st-answered, .st-adopt, .st-exists { background: var(--ok-soft); color: var(--ok); }
.st-building, .st-doing, .st-learn-from, .st-planned, .st-new, .st-rec { background: var(--accent-soft); color: var(--accent); }
.st-blocked, .st-avoid, .st-accepted { background: var(--bad-soft); color: var(--bad); }
.st-todo.pill { background: var(--sunken); color: var(--ink-2); }
.lv-high { background: var(--bad-soft); color: var(--bad); }
.lv-medium { background: var(--warn-soft); color: var(--warn); }
.lv-low { background: var(--sunken); color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-block; padding: 3px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); font-size: .86rem; }
.file { font: .8rem var(--mono); padding: 2px 7px; border-radius: 5px; background: var(--sunken); color: var(--ink-2); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.kv dt { font-size: .84rem; color: var(--ink-3); padding-top: 1px; }
.kv dd { margin: 0; min-width: 0; }
.card .kv { grid-template-columns: 1fr; gap: 0; }
.card .kv dt { font: 600 .66rem var(--mono); letter-spacing: .06em; text-transform: uppercase; margin-top: 8px; }
.card .kv dt:first-child { margin-top: 0; }
.marks { list-style: none; padding: 0; }
.marks li { position: relative; padding-left: 22px; margin: 6px 0; }
.marks li::before { position: absolute; left: 0; top: 0; font-weight: 600; }
.marks.yes li::before { content: '✓'; color: var(--ok); }
.marks.no li::before { content: '✕'; color: var(--bad); }
.marks.to li::before { content: '→'; color: var(--accent); }
.marks.dot li::before { content: '•'; color: var(--ink-3); left: 4px; }
.lede-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.lede { padding: 18px 20px; border-radius: 10px; background: var(--surface); border: 1px solid var(--rule); }
.lede.out { background: var(--accent-soft); border-color: transparent; }
.lede p { font: 400 1.18rem/1.5 var(--serif); margin-top: 6px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; }
.callout { border-radius: 10px; padding: 16px 18px; margin-bottom: 26px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.callout.warn { background: var(--warn-soft); }
.callout.bad { background: var(--bad-soft); display: block; }
.callout.info { background: var(--accent-soft); display: block; }
.callout h2 { font: 600 1.2rem/1.3 var(--serif); margin: 0 0 4px; }
.callout.warn h2 { color: var(--warn); }
.callout.bad h2 { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; }
.stat .k { font-size: .8rem; color: var(--ink-3); }
.stat b { display: block; font: 600 1.6rem/1.2 var(--serif); margin: 2px 0; }
.stat .s { font-size: .8rem; color: var(--ink-2); }
.hbar { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.hbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.measure { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; font-size: .9rem; }
.measure .eyebrow { display: block; margin-bottom: 2px; color: var(--accent); }
.term { background: #16171b; color: #e6e5df; border-radius: 10px; padding: 14px 16px; font: .82rem/1.6 var(--mono); }
.term .k { color: #8b8a84; display: inline-block; min-width: 8.5em; }
.term div { display: flex; gap: 8px; padding: 3px 0; }
.term div + div { border-top: 1px solid #26272c; }
.term code { background: none; padding: 0; color: #e6e5df; font-size: 1em; }
.term .note { font-family: var(--sans); color: #b9b7af; }
.diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; margin: 0 0 14px; }
.diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.diagram pre { background: none; padding: 0; }
.figcap { font-size: .84rem; color: var(--ink-2); margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
th { font: 600 .7rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }

/* ---- risks ---- */
.risk-wrap { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
.matrix { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 3px; font-size: .72rem; }
.matrix .ax { color: var(--ink-3); font-family: var(--mono); display: flex; align-items: center; justify-content: center; text-transform: uppercase; letter-spacing: .04em; }
.matrix .ax.y { justify-content: flex-end; padding-right: 6px; }
.matrix .cell { aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; font: 600 1rem var(--serif); color: var(--ink-3); background: var(--sunken); }
.matrix .cell.h1 { background: color-mix(in srgb, var(--ok) 16%, var(--surface)); }
.matrix .cell.h2 { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); }
.matrix .cell.h3 { background: color-mix(in srgb, var(--bad) 26%, var(--surface)); }
.matrix .cell.has { color: var(--ink); }
.matrix .cap { grid-column: 2 / -1; text-align: center; color: var(--ink-3); font-family: var(--mono); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
.risk { border-left: 3px solid var(--rule-2); padding: 10px 14px; background: var(--surface); border-radius: 0 8px 8px 0; margin-bottom: 8px; }
.risk.h3 { border-left-color: var(--bad); }
.risk.h2 { border-left-color: var(--warn); }
.risk .r { font-weight: 500; }
.risk .m { font-size: .88rem; color: var(--ink-2); margin-top: 4px; }

/* ---- steps ---- */
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .84rem; color: var(--ink-2); margin: 10px 0 18px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; background: var(--rule); vertical-align: -1px; }
.legend .st-done i { background: var(--ok); } .legend .st-doing i { background: var(--accent); } .legend .st-blocked i { background: var(--bad); }
.legend span { background: none; color: inherit; }
.timeline { list-style: none; padding: 0; margin: 0; position: relative; }
.timeline::before { content: ''; position: absolute; left: 9px; top: 12px; bottom: 12px; width: 2px; background: var(--rule); }
.tl { position: relative; padding-left: 34px; margin: 0 0 10px; }
.tl .dot { position: absolute; left: 3px; top: 17px; width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--rule-2); }
.tl.st-done .dot { background: var(--ok); border-color: var(--ok); }
.tl.st-doing .dot { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.tl.st-blocked .dot { background: var(--bad); border-color: var(--bad); }
.tl, .tl.st-done, .tl.st-doing, .tl.st-blocked, .tl.st-todo { background: none; color: inherit; }
details.step { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.tl.st-doing details.step { border-color: var(--accent); box-shadow: var(--shadow); }
details.step > summary { list-style: none; cursor: pointer; padding: 12px 16px; }
details.step > summary::-webkit-details-marker { display: none; }
.step-h { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.step-h .t { font-weight: 600; flex: 1 1 260px; min-width: 0; }
.step-h .chev { margin-left: auto; color: var(--ink-3); transition: transform .15s; font-size: .8rem; }
details[open] > summary .chev { transform: rotate(90deg); }
.done-when { font-size: .88rem; color: var(--ink-2); margin: 6px 0 0; }
.lbl { font: 600 .68rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-right: 6px; }
.step-b { padding: 4px 16px 16px; border-top: 1px solid var(--rule); }
.step-b > * { margin-top: 12px; }
.tests { counter-reset: t; list-style: none; padding: 0; margin: 4px 0 0; }
.tests li { counter-increment: t; position: relative; padding: 6px 0 6px 30px; border-bottom: 1px dashed var(--rule); font-size: .9rem; }
.tests li:last-child { border-bottom: 0; }
.tests li::before { content: counter(t); position: absolute; left: 0; top: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--bad-soft); color: var(--bad); font: 600 .7rem/20px var(--mono); text-align: center; }
.evidence { font: .8rem/1.6 var(--mono); color: var(--ink-2); background: var(--sunken); border-radius: 8px; padding: 10px 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---- changelog ---- */
.log { list-style: none; padding: 0; margin: 0; }
.log li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); align-items: baseline; margin: 0; }
.log .d { font: .8rem var(--mono); color: var(--ink-3); }

/* ---- questions ---- */
.phases { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-wrap: wrap; gap: 6px; }
.phases li { margin: 0; }
.phase { display: inline-flex; gap: 8px; align-items: center; font: 500 .88rem var(--sans); padding: 6px 12px 6px 6px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.phase .num { display: inline-grid; place-items: center; width: 1.65em; height: 1.65em; border-radius: 50%; background: var(--sunken); font: 600 .75rem var(--mono); }
.phase .k { font: .75rem var(--mono); color: var(--ink-3); }
.phase.current { border-color: var(--accent); color: var(--ink); }
.phase.current .num { background: var(--accent); color: var(--on-accent); }
.phase.complete .num { background: var(--ok); color: var(--on-accent); }
.q-card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; scroll-margin-top: 16px; }
.q-h { display: flex; gap: 10px; align-items: flex-start; }
.q-h h4 { font: 600 1.12rem/1.35 var(--serif); margin: 0; flex: 1; }
.q-why { color: var(--ink-2); font-size: .9rem; margin: 6px 0 0; }
.choices { display: grid; gap: 6px; margin: 14px 0 0; }
.choice { display: flex; gap: 10px; align-items: baseline; border: 1px solid var(--rule); border-radius: 8px; padding: 9px 12px; cursor: pointer; background: var(--paper); }
.choice:hover, label.option:hover { border-color: var(--rule-2); }
.choice.rec, .option.rec { border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
.choice:has(input:checked), label.option:has(input:checked) { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); background: var(--ok-soft); }
input[type=radio], input[type=checkbox] { accent-color: var(--ok); }
.answer { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--ok-soft); }
.answer .lbl { color: var(--ok); }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 14px 0 0; }
.options.wide { grid-template-columns: minmax(0, 1fr); }
.options > * { min-width: 0; }
.option { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; background: var(--paper); }
.option.chosen { border-color: var(--ok); box-shadow: 0 0 0 1px var(--ok); background: var(--surface); }
label.option { display: block; cursor: pointer; }
.option h5 { margin: 0 0 8px; font: 600 .95rem/1.35 var(--sans); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: .86rem; }
.pc .lbl { display: block; margin-bottom: 2px; }
.pc .marks li { margin: 3px 0; }
.dec { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; scroll-margin-top: 16px; }
.dec .kv { margin-top: 14px; font-size: .92rem; }
.dec { padding: 16px 20px; }
.dec .chosen-line { margin-top: 10px; }
.chosen-line { margin-top: 12px; padding: 10px 12px; border-radius: 8px; background: var(--ok-soft); }
.chosen-line b { color: var(--ok); }
details.more { margin-top: 12px; }
details.more > summary { cursor: pointer; color: var(--accent); font-size: .88rem; }
details.answered { margin-top: 18px; }
details.answered > summary { cursor: pointer; color: var(--ink-2); font-size: .9rem; margin-bottom: 12px; }
.phase-nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.sent { color: var(--ok); font-size: .85rem; margin-top: 8px; }
.sent:empty { display: none; }

/* ---- controls ---- */
button { font: 500 .88rem var(--sans); padding: 7px 14px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--ink-3); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.primary:hover { filter: brightness(1.08); }
button:disabled { opacity: .45; cursor: default; filter: none; }
button.link { border: 0; background: none; color: var(--accent); padding: 0 2px; font-size: .84rem; font-weight: 500; }
input[type=text], textarea { display: block; width: 100%; font: .92rem var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--rule-2); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
textarea { resize: vertical; }
.sendbar { position: sticky; bottom: 14px; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--rule-2); border-radius: 12px; padding: 10px 12px; margin-top: 18px; box-shadow: 0 10px 34px rgba(0, 0, 0, .14); }
.sendbar input { flex: 1 1 220px; margin: 0; }
.sendbar .count { font-size: .88rem; font-weight: 500; }
.status { flex-basis: 100%; font-size: .85rem; color: var(--ink-2); }
.status:empty { display: none; }
.status.bad { color: var(--bad); }
footer { color: var(--ink-3); font-size: .78rem; font-family: var(--mono); margin-top: 30px; }

/* ---- design and demo ---- */
.frames-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; }
.frames-bar button { padding: 4px 10px; font-size: .8rem; }
.frames-bar button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.screen { border-top: 1px solid var(--rule); padding-top: 18px; margin-top: 18px; scroll-margin-top: 16px; }
.screen h4 { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font: 600 1.1rem var(--serif); margin: 0 0 6px; }
.frame { overflow: hidden; border: 1px solid var(--rule); border-radius: 10px; background: #fff; margin: 8px auto 0; max-width: 100%; box-shadow: var(--shadow); }
.frame iframe { border: 0; display: block; transform-origin: 0 0; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.swatch .chipc { height: 64px; border-radius: 8px; border: 1px solid var(--rule); margin-bottom: 6px; }
.swatch small { display: block; color: var(--ink-2); }
.swatch small.low { color: var(--bad); font-weight: 600; }
.scenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.scene .time { font: .75rem var(--mono); color: var(--ink-3); }
.scene .cap { font: italic 400 1rem/1.4 var(--serif); margin-top: 8px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; padding: 0 16px 120px; }
  .rail { min-width: 0; }
  .meta .sep { display: none; }
  .rail { position: sticky; top: 0; z-index: 4; max-height: none; padding: 8px 0; margin: 0 -16px; padding-left: 16px; background: var(--paper); border-bottom: 1px solid var(--rule); overflow-x: auto; }
  .rail [role=tablist] { display: flex; gap: 4px; }
  .rail [role=tab] { width: auto; white-space: nowrap; }
  .rail [role=tab] .n, .sub { display: none; }
  .masthead .in { grid-template-columns: 1fr; padding: 22px 16px 18px; }
  .masthead h1 { font-size: 1.7rem; }
  .progress-box { min-width: 0; }
  .content { padding-top: 20px; }
  .lede-grid, .split, .risk-wrap { grid-template-columns: 1fr; }
  .matrix { max-width: 260px; }
}
@media (max-width: 560px) {
  .pc { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .row { grid-template-columns: 52px minmax(0, 1fr); }
  .row > :nth-child(3) { grid-column: 2; }
  .log li { grid-template-columns: 1fr auto; }
  .log .d { grid-column: 1 / -1; }
  .cards.two { grid-template-columns: 1fr; }
}
@media print {
  .rail, .phases, .phase-nav, footer, .sendbar, button { display: none; }
  .shell { display: block; }
  [role=tabpanel][hidden], [data-phase-panel][hidden] { display: block !important; }
  details.step:not([open]) > .step-b { display: block; }
  .card, .q-card, .dec, details.step { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="app"><p class="muted" style="padding:24px">Loading plan.js…</p></div>
<script>
'use strict';
const app = document.getElementById('app');
let last = '';
let plan = null;
let pending = null;

// Served by scripts/serve.js, the page can send answers and comments to
// Claude. Opened as a file it is read-only.
const KEY = new URLSearchParams(location.search).get('key');
const LIVE = /^https?:$/.test(location.protocol) && !!KEY;
// Plans and designs take answers while they're drafts; a demo takes comments throughout.
const asking = p => LIVE && ((p.meta || {}).status === 'draft' || (p.meta || {}).kind === 'demo');

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Ids the plan defines (Q4, D1, S3...), each with the element it links to.
// Filled on every render, so text that names one becomes a link to it.
let IDS = new Map();
const refs = h => h.replace(/\b(SC\d+|[QDFNTSA]\d+)\b/g, m => IDS.has(m) ? `<a class="ref" href="#${IDS.get(m)}">${m}</a>` : m);
// Plain text with `code` spans and line breaks; everything else stays escaped.
const txt0 = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
const txt = s => refs(txt0(s));
// Longer text: paragraphs on blank lines.
const para = s => String(s ?? '').split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).map(b => `<p>${txt(b)}</p>`).join('');
const isNa = v => v && typeof v === 'object' && !Array.isArray(v) && typeof v.na === 'string';
const has = v => isNa(v) || (Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.keys(v).length > 0 : !!v);
const na = v => `<p class="na">Not applicable: ${txt(v.na)}</p>`;
const empty = '<p class="empty">Not written yet.</p>';
const cap = s => String(s ?? '').replace(/^./, c => c.toUpperCase());
const pill = (s, label) => s ? `<span class="pill st-${esc(String(s).replace(/\s+/g, '-'))}">${esc(cap(label || s))}</span>` : '';
const lv = s => { const v = String(s || '').toLowerCase(); return v.includes('high') ? 3 : v.includes('low') ? 1 : 2; };
const lvName = n => ['', 'low', 'medium', 'high'][n];
const url = u => /^https?:\/\//i.test(u || '') ? esc(u) : null;
const arr = x => (Array.isArray(x) ? x : []);
const marks = (items, kind = 'dot', f = txt) => isNa(items) ? na(items) : arr(items).length ? `<ul class="marks ${kind}">${items.map(i => `<li>${f(i)}</li>`).join('')}</ul>` : empty;
const list = (items, f = txt) => marks(items, 'dot', f);
const idChip = (id, anchor) => id ? (anchor ? `<a class="id" href="#${esc(anchor)}">${esc(id)}</a>` : `<span class="id">${esc(id)}</span>`) : '';
const refChips = ids => arr(ids).map(i => IDS.has(i) ? `<a class="id" href="#${esc(IDS.get(i))}">${esc(i)}</a>` : `<span class="id">${esc(i)}</span>`).join(' ');
const ref = r => r ? `<span class="file">${esc(r)}</span>` : '';
const files = fs => arr(fs).length ? `<div class="chips">${fs.map(f => `<span class="file">${esc(f)}</span>`).join('')}</div>` : '';
const table = (rows, cols) => {
  if (isNa(rows)) return na(rows);
  if (!Array.isArray(rows) || !rows.length) return empty;
  return `<div class="scroll"><table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
// Rows of [id, main, side, below]; for lists of short, id'd items.
const rows = (items, f, ids = true) => isNa(items) ? na(items) : !arr(items).length ? empty
  : `<div class="rows">${items.map(i => { const [id, main, side, below, anchor] = f(i); return `<div class="row${ids ? '' : ' noid'}"${anchor ? ` id="${esc(anchor)}"` : ''}>${
    ids ? `<span>${idChip(id)}</span>` : ''}<div>${main}</div><div>${side || ''}</div>${below ? `<div class="sub2">${below}</div>` : ''}</div>`; }).join('')}</div>`;
const kv = pairs => { const r = pairs.filter(([, v]) => v); return r.length ? `<dl class="kv">${r.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` : ''; };
const kilo = n => (n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}k` : String(n || 0));
// An empty dependency list is an answer ("none"); elsewhere empty means unwritten.
const present = (p, id) => id === 'later' || id === 'current' || id === 'cost' || id === 'video' || id === 'storylines' ? true : id === 'impact' ? isNa(p.context) || has(p.impact) || isNa(p.impact)
  : ['dependencies', 'needsYou'].includes(id) ? Array.isArray(p[id]) || isNa(p[id]) : has(p[id]);
// The build's size in the work Claude does, as an honest stand-in for hours.
// Mirrors plan-tool.js reviewFor, from what the plan states explicitly.
function buildSize(p) {
  const steps = Array.isArray(p.steps) ? p.steps : [];
  const effort = (p.meta || {}).effort || 'standard';
  const threats = p.security && Array.isArray(p.security.threats) ? p.security.threats : [];
  const hot = p.architecture && Array.isArray(p.architecture.hotPaths) ? p.architecture.hotPaths : [];
  const std = (s, r) => Array.isArray(s.standards) && s.standards.includes(r);
  const reviewed = steps.filter(s => effort === 'thorough' || threats.some(t => t.step === s.id) ||
    (effort === 'standard' && (std(s, 'data-and-apis') || std(s, 'reliability') || hot.some(h => h.provedBy === s.id)))).length;
  const runs = 2 + (effort === 'light' ? 0 : steps.filter(s => std(s, 'run-like-a-user')).length);
  return { steps: steps.length, reviewed, runs, effort };
}
function indexIds(p) {
  IDS = new Map();
  const put = (xs, pre = '') => { for (const x of arr(xs)) if (x && x.id) IDS.set(String(x.id), pre + x.id); };
  put(p.questions);
  put(p.decisions, 'dec-');
  if (p.requirements && !isNa(p.requirements)) { put(p.requirements.functional, 'req-'); put(p.requirements.nonFunctional, 'req-'); }
  if (p.security && !isNa(p.security)) put(p.security.threats, 'thr-');
  if (p.testing && !isNa(p.testing)) put(p.testing.acceptance, 'acc-');
  if (!isNa(p.steps)) put(p.steps);
  put(p.screens);
  put(p.scenes, 'scene-');
  put(p.storylines, 'sl-');
}

// ---- what the user is writing --------------------------------------------

// Kept in this browser until sent, so a reload or a plan.js refresh never
// loses it. `sent` remembers what went out, to show it and not send it twice.
let draft = { answers: {}, comments: {}, message: '', sent: {} };
let status = { text: '', bad: false };
const opened = new Set();
const storeKey = () => 'naqsha:' + ((plan && plan.meta && plan.meta.slug) || location.pathname);
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(storeKey()) || 'null');
    if (d) draft = { answers: d.answers || {}, comments: d.comments || {}, message: d.message || '', sent: d.sent || {} };
  } catch { /* storage blocked: the draft lives in memory only */ }
}
function saveDraft() {
  try { localStorage.setItem(storeKey(), JSON.stringify(draft)); } catch { /* same */ }
}

const openItems = p => [
  ...(Array.isArray(p.questions) ? p.questions.filter(q => q.status !== 'answered') : []),
  ...(Array.isArray(p.decisions) ? p.decisions.filter(d => d.status !== 'decided') : []),
];
const answered = a => !!a && (a.choice.length > 0 || a.text.trim() !== '');
const unsent = (id, a) => answered(a) && draft.sent[id] !== JSON.stringify(a);
const answerText = a => !a ? '' : typeof a === 'string' ? a
  : [(a.choice || []).join(', '), a.text, a.note && `(${a.note})`].filter(Boolean).join(' · ');

const choice = (id, value, multiple, rec) => `<label class="choice${rec ? ' rec' : ''}">
    <input type="${multiple ? 'checkbox' : 'radio'}" name="ans-${esc(id)}" data-id="${esc(id)}" data-f="choice" value="${esc(value)}">
    <span>${txt(value)}${rec ? ' <span class="pill st-rec plain">recommended</span>' : ''}</span></label>`;
const ownAnswer = (id, label) => `<input type="text" data-id="${esc(id)}" data-f="text" placeholder="${label}" aria-label="${esc(id)}: ${label}">`;
const noteBox = id => `<textarea data-id="${esc(id)}" data-f="note" rows="2" placeholder="Notes for Claude (optional)" aria-label="${esc(id)}: notes"></textarea>`;
const sentLine = id => draft.sent[id] ? `<p class="sent" data-sent="${esc(id)}"></p>` : '';

function question(q, ask) {
  const opts = Array.isArray(q.options) ? q.options : [];
  let body = '';
  if (q.status === 'answered') {
    body = `<div class="answer"><span class="lbl">Your answer</span>${txt(answerText(q.answer))}</div>`;
  } else if (ask && opts.length) {
    body = `<div class="choices">${opts.map(o => choice(q.id, o, q.multiple, o === q.recommendation)).join('')}</div>
      ${ownAnswer(q.id, 'Something else')}${noteBox(q.id)}${sentLine(q.id)}`;
  } else if (ask) {
    body = `<textarea data-id="${esc(q.id)}" data-f="text" rows="3" placeholder="Your answer" aria-label="${esc(q.id)}: your answer"></textarea>${sentLine(q.id)}`;
  } else if (opts.length) {
    body = `<div class="choices">${opts.map(o => `<div class="choice${o === q.recommendation ? ' rec' : ''}"><span>${txt(o)}${o === q.recommendation ? ' <span class="pill st-rec plain">recommended</span>' : ''}</span></div>`).join('')}</div>`;
  }
  return `<div class="q-card" id="${esc(q.id)}">
      <div class="q-h">${idChip(q.id)}<h4>${txt(q.question)}</h4>${pill(q.status || 'open')}</div>
      ${q.why ? `<p class="q-why">${txt(q.why)}</p>` : ''}${body}</div>`;
}

// A rendered clip from the demo's renders/ folder.
const clip = f => f && /^renders\/[A-Za-z0-9][A-Za-z0-9._-]*\.(mp4|webm)$/.test(f) ? `<video src="${esc(f)}${KEY ? `?key=${encodeURIComponent(KEY)}` : ''}" controls loop muted playsinline preload="metadata" style="width:100%;margin-top:10px;border-radius:8px;background:#000"></video>` : '';
// A demo's storyline: a different film, not another title on the same one.
const storylineBody = s => `${s.device || s.form ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${s.device ? `<span class="tag">${esc(s.device)}</span>` : ''}${s.form ? `<span class="tag">${esc(s.form)}</span>` : ''}</div>` : ''}
    ${s.sees ? `<p class="small">${txt(s.sees)}</p>` : ''}
    ${kv([['First two seconds', s.first && txt(s.first)], ['Beats', s.beats && txt(s.beats)], ['Look', s.look && txt(s.look)], ['Sound', s.sound && txt(s.sound)]])}`;
const storylineOf = id => id && plan ? arr(plan.storylines).find(s => s.id === id) : null;

function optionCard(d, o, pick) {
  const rec = o.name === d.recommendation;
  const chosen = o.name === d.choice;
  const sl = storylineOf(o.storyline);
  const inner = `<h5>${pick ? `<input type="radio" name="ans-${esc(d.id)}" data-id="${esc(d.id)}" data-f="choice" value="${esc(o.name)}">` : ''}<span>${txt(o.name)}</span>${
      chosen ? '<span class="pill st-done">chosen</span>' : rec ? '<span class="pill st-rec plain">recommended</span>' : ''}</h5>
    ${sl ? storylineBody(sl) : ''}
    ${!sl || arr(o.pros).length || arr(o.cons).length ? `<div class="pc"><div><span class="lbl">Pros</span>${marks(o.pros, 'yes')}</div><div><span class="lbl">Cons</span>${marks(o.cons, 'no')}</div></div>` : ''}
    ${o.preview ? frame(frameDoc(plan || {}, o.preview, !!(plan && plan.tokens)), `${o.name}, preview`) : ''}
    ${clip(o.video || (sl && sl.clip))}`;
  const cls = `option${rec ? ' rec' : ''}${chosen ? ' chosen' : ''}`;
  return pick ? `<label class="${cls}">${inner}</label>` : `<div class="${cls}">${inner}</div>`;
}

function decision(d, ask, idPrefix = '') {
  const pick = ask && d.status !== 'decided';
  const opts = arr(d.options);
  const visual = opts.some(o => o.preview || o.video || o.storyline);
  const grid = `${opts.some(o => o.preview) ? sizeBar() : ''}<div class="options${visual ? ' wide' : ''}">${opts.map(o => optionCard(d, o, pick)).join('')}</div>`;
  const decided = d.status === 'decided';
  const why = kv([['Why the recommendation', d.why && txt(d.why)], ['Serves', arr(d.drivers).length && refChips(d.drivers)],
    ['Consequences', d.consequences && txt(d.consequences)], ['How we’ll know', d.confirmation && txt(d.confirmation)]]);
  return `<div class="dec" id="${esc(idPrefix + d.id)}">
      <div class="q-h">${idChip(d.id)}<h4>${txt(d.question)}</h4>${pill(d.status)}</div>
      ${decided ? `<div class="chosen-line"><b>Chose ${txt(d.choice)}</b> <span class="muted small">· ${esc(d.decidedBy)}</span>${d.note ? `<div class="small">${txt(d.note)}</div>` : ''}</div>
        <details class="more"${visual ? ' open' : ''}><summary>Why, and the ${opts.length} options compared</summary>${why}${grid}</details>` : grid + why}
      ${pick ? ownAnswer(d.id, 'Something else (instead of the options above)') + noteBox(d.id) + sentLine(d.id) : ''}
    </div>`;
}

// ---- design previews --------------------------------------------------------

// A design's screens render in sandboxed frames with no scripts, styled only by
// its tokens, so the user sees the real look before any code exists.
const WIDTHS = { phone: [390, 780], tablet: [820, 1000], desktop: [1440, 900] };
let frameWidth = 'desktop';
let frameDark = false;
const frameState = {};
const slugOf = s => String(s ?? '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const cssValue = v => String(v ?? '').replace(/[<>{};"]/g, '');
function tokenCss(p, dark) {
  const t = p.tokens || {};
  const colors = new Map(arr(t.color).map(c => [slugOf(c.name), c.value]));
  if (dark) for (const c of arr(t.dark)) colors.set(slugOf(c.name), c.value);
  const type = t.type || {};
  const vars = [
    ...[...colors].map(([n, v]) => `--color-${n}: ${cssValue(v)};`),
    ...arr(type.families).map(f => `--font-${slugOf(String(f.role || '').split(/\s+/)[0])}: "${cssValue(f.name)}", system-ui, sans-serif;`),
    ...arr(type.scale).flatMap(x => [`--size-${slugOf(x.name)}: ${cssValue(x.size)};`, `--leading-${slugOf(x.name)}: ${cssValue(x.lineHeight)};`, `--weight-${slugOf(x.name)}: ${cssValue(x.weight)};`]),
    ...arr(t.space).map((v, i) => `--space-${i + 1}: ${cssValue(v)};`),
    ...arr(t.radius).map(r => `--radius-${slugOf(r.name)}: ${cssValue(r.value)};`),
    ...arr(t.shadow).map(r => `--shadow-${slugOf(r.name)}: ${cssValue(r.value)};`),
    ...Object.entries(t.motion || {}).map(([k, v]) => `--motion-${slugOf(k)}: ${cssValue(v)};`),
  ];
  return `:root{${vars.join('')}color-scheme:${dark ? 'dark' : 'light'}}` +
    'body{margin:0;background:var(--color-bg,Canvas);color:var(--color-text,CanvasText);font-family:var(--font-body,system-ui)}';
}
const fontLinks = p => arr(((p.tokens || {}).type || {}).families).filter(f => f.source === 'google' && f.name)
  .map(f => `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${encodeURIComponent(f.name).replace(/%20/g, '+')}${
    arr(f.weights).length ? ':wght@' + arr(f.weights).map(Number).filter(Boolean).sort((a, b) => a - b).join(';') : ''}&display=swap">`).join('');
const frameDoc = (p, html, tokens = true) => '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
  (tokens ? `${fontLinks(p)}<style>${tokenCss(p, frameDark)}</style>` : '') + `</head><body>${html || ''}</body></html>`;
const frame = (doc, label, size = frameWidth) => `<div class="frame" data-size="${size}"><iframe sandbox title="${esc(label)}" srcdoc="${esc(doc)}"></iframe></div>`;
// Frames render at the real device width, scaled down to fit the column.
function fitFrames() {
  for (const box of app.querySelectorAll('.frame')) {
    const [w, h] = WIDTHS[box.dataset.size] || WIDTHS.desktop;
    const parent = box.parentElement;
    const pad = parseFloat(getComputedStyle(parent).paddingLeft) + parseFloat(getComputedStyle(parent).paddingRight);
    const avail = parent.clientWidth - pad;
    if (avail <= 0) continue;
    const scale = Math.min(1, avail / w);
    Object.assign(box.firstElementChild.style, { width: `${w}px`, height: `${h}px`, transform: `scale(${scale})` });
    Object.assign(box.style, { width: `${Math.floor(w * scale)}px`, height: `${Math.round(h * scale)}px` });
  }
}
addEventListener('resize', fitFrames);
function luminance(hex) {
  const m = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex || '').trim());
  if (!m) return null;
  const h = m[1].length === 3 ? [...m[1]].map(c => c + c).join('') : m[1];
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
const contrast = (a, b) => {
  const x = luminance(a), y = luminance(b);
  return x === null || y === null ? null : (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
};
// Phone, tablet and desktop for every preview on the page, plus dark when the tokens have it.
const sizeBar = (dark = arr(((plan || {}).tokens || {}).dark).length) => `<div class="frames-bar" role="group" aria-label="Preview size">${
  Object.keys(WIDTHS).map(w => `<button type="button" data-width="${w}" aria-pressed="${w === frameWidth}">${w[0].toUpperCase() + w.slice(1)} · ${WIDTHS[w][0]}px</button>`).join('')}${
  dark ? `<button type="button" data-dark="1" aria-pressed="${frameDark}">Dark</button>` : ''}</div>`;

// An existing screen also shows how it looks now, as the first button.
function screenHtml(p, sc, ask) {
  const states = [...(sc.current ? ['now'] : []), ...(arr(sc.states).length ? sc.states : ['default'])];
  const cur = states.includes(frameState[sc.id]) ? frameState[sc.id] : states[sc.current ? 1 : 0] || states[0];
  const cid = 'screen' + String(sc.id || '').replace(/[^A-Za-z0-9]/g, '');
  const html = cur === 'now' ? sc.current : sc.previews && sc.previews[cur];
  return `<div class="screen" id="${esc(sc.id)}">
    <h4>${idChip(sc.id)} ${txt(sc.name)} ${sc.mode ? `<span class="tag">${esc(sc.mode)}</span>` : ''} ${commentButton(cid, ask)}</h4>
    ${commentBox(cid, ask)}
    <p>${txt(sc.purpose)}${sc.data ? `<br><span class="muted small">Data: ${txt(sc.data)}</span>` : ''}${sc.notes ? `<br><span class="muted small">${txt(sc.notes)}</span>` : ''}</p>
    ${arr(sc.needs).length ? `<details class="more"><summary>Where its data comes from (${arr(sc.needs).length})</summary>${table(sc.needs, [['Needs', x => txt(x.what)],
      ['Source', x => `${x.status === 'contract' ? pill('open', 'contract, owed') : x.status === 'planned' ? pill('planned') : x.status === 'exists' ? pill('exists') : '<span class="empty">no source</span>'}<br>${txt(x.from)}`],
      ['Owed', x => txt(x.owed)]])}</details>` : ''}
    <div class="frames-bar" role="group" aria-label="${esc(sc.name)}: state">${states.map(st => `<button type="button" data-screen="${esc(sc.id)}" data-state="${esc(st)}" aria-pressed="${st === cur}">${
      st === 'now' ? 'Now' : esc(st)}${st === 'now' || (sc.previews && sc.previews[st]) ? '' : ' (no preview)'}</button>`).join('')}</div>
    ${html ? frame(frameDoc(p, html, cur !== 'now'), `${sc.name}, ${cur === 'now' ? 'as it is now' : cur}`) : '<p class="empty">No preview for this state yet.</p>'}
  </div>`;
}

// ---- steps ------------------------------------------------------------------

// Which steps the viewer opened or closed; otherwise the step in progress is open.
const stepOpen = {};
const STEP_STATES = ['done', 'doing', 'todo', 'blocked'];
function stepHtml(p, x) {
  const st = STEP_STATES.includes(x.status) ? x.status : 'todo';
  const open = stepOpen[x.id] ?? st === 'doing';
  const cost = p.cost && p.cost.steps && p.cost.steps[x.id];
  const tests = isNa(x.tests) ? `<p class="muted small"><span class="lbl">No test first</span>${txt(x.tests.na)}</p>`
    : arr(x.tests).length ? `<div><span class="lbl">Tests first, in order</span><ol class="tests">${x.tests.map(t => `<li>${txt(t.test)}${t.kind ? ` <span class="tag">${esc(t.kind)}</span>` : ''}</li>`).join('')}</ol></div>`
    : '<p class="empty">No tests listed</p>';
  return `<li class="tl st-${st}" id="${esc(x.id)}"><span class="dot"></span>
    <details class="step" data-step="${esc(x.id)}"${open ? ' open' : ''}>
      <summary><div class="step-h">${idChip(x.id)}<span class="t">${txt(x.title)}</span>${pill(st)}
        ${arr(x.dependsOn).length ? `<span class="faint small">after ${esc(x.dependsOn.join(', '))}</span>` : ''}
        ${cost ? `<span class="faint small">${esc(kilo(cost.weight))} tokens</span>` : ''}<span class="chev">▶</span></div>
        <p class="done-when"><span class="lbl">Done when</span>${txt(x.doneWhen) || '<span class="empty">missing</span>'}</p></summary>
      <div class="step-b">
        ${x.detail ? `<div class="prose">${para(x.detail)}</div>` : ''}
        ${arr(x.files).length ? `<div><span class="lbl">Files</span>${files(x.files)}</div>` : ''}
        ${arr(x.screens).length ? `<div><span class="lbl">Screens</span>${refChips(x.screens)}</div>` : ''}
        ${tests}
        ${arr(x.standards).length ? `<div><span class="lbl">Standards</span>${x.standards.map(s => `<span class="tag">${esc(s)}</span>`).join(' ')}</div>` : ''}
        ${x.notes ? `<div><span class="lbl">Build notes</span><div class="evidence">${esc(x.notes)}</div></div>` : ''}
      </div></details></li>`;
}
