<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
:root {
  --paper: #f6f4ee; --surface: #fffdf9; --sunken: #efece5; --ink: #1c1b18; --ink-2: #57534b; --ink-3: #8b877d;
  --rule: #e4e0d6; --rule-2: #d3cdc0;
  --accent: #2447c9; --accent-soft: #e8ecfa; --on-accent: #ffffff;
  --ok: #1b7445; --ok-soft: #e2f0e6; --warn: #985600; --warn-soft: #fbefda; --bad: #b3241b; --bad-soft: #f9e4e1;
  --sev-critical: #b3241b; --sev-high: #c2570c; --sev-medium: #a87b00; --sev-low: #8b877d;
  --grid: rgba(36, 71, 201, .07); --shadow: 0 1px 2px rgba(28, 27, 24, .05), 0 6px 20px rgba(28, 27, 24, .06);
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 2px; }
p { margin: 0 0 10px; }
p:last-child { margin-bottom: 0; }
code { font: .84em var(--mono); background: var(--sunken); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
ul { margin: 0; padding-left: 20px; }
li { margin: 3px 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.eyebrow { font: 500 .72rem/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.lbl { font: 600 .7rem var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.empty { color: var(--ink-2); font-style: italic; }

/* ---- masthead ---- */
.masthead { border-bottom: 1px solid var(--rule); background:
  linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
  linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px, var(--surface); }
.masthead .in { max-width: 1080px; margin: 0 auto; padding: 30px 24px 26px; }
.masthead h1 { font: 600 2.2rem/1.15 var(--serif); letter-spacing: -.01em; margin: 8px 0 12px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--ink-2); font-size: .86rem; }
.meta .sep { color: var(--rule-2); }
.verdict { font: 400 1.3rem/1.5 var(--serif); max-width: 62ch; margin: 22px 0 0; }

main { max-width: 1080px; margin: 0 auto; padding: 28px 24px 120px; }
.sec { padding: 4px 0 34px; margin-bottom: 30px; border-bottom: 1px solid var(--rule); }
.sec:last-of-type { border-bottom: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.sec-h h2 { font: 600 1.55rem/1.2 var(--serif); margin: 0; }
h3 { font: 600 .74rem/1.3 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }

/* ---- summary ---- */
.sevbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunken); gap: 2px; margin-bottom: 14px; }
.sevbar i { display: block; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.stat:hover { background: var(--sunken); }
.stat b { display: block; font: 600 1.9rem/1.1 var(--serif); }
.stat span { font-size: .82rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.stat span i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.overview { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; margin-top: 26px; }
.top { list-style: none; padding: 0; margin: 0; counter-reset: r; }
.top li { counter-increment: r; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); margin: 0; align-items: baseline; }
.top li::before { content: counter(r); font: 600 1.1rem var(--serif); color: var(--ink-3); }
.top a { color: var(--ink); text-decoration: none; font-weight: 500; }
.top a:hover { color: var(--accent); }
.callout { border-radius: 10px; padding: 14px 16px; background: var(--accent-soft); margin-bottom: 18px; }
.callout .lbl { color: var(--accent); display: block; margin-bottom: 4px; }
.marks { list-style: none; padding: 0; }
.marks li { position: relative; padding-left: 22px; margin: 7px 0; }
.marks li::before { position: absolute; left: 0; top: 0; font-weight: 600; }
.marks.yes li::before { content: '✓'; color: var(--ok); }
.marks.skip li::before { content: '–'; color: var(--ink-3); left: 3px; }
.file { font: .78rem var(--mono); padding: 1px 6px; border-radius: 5px; background: var(--sunken); color: var(--ink-2); overflow-wrap: anywhere; }

/* ---- findings ---- */
.sev { display: inline-flex; align-items: center; gap: 6px; font: 600 .7rem/1.6 var(--mono); padding: 0 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.sev::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sev.critical, [data-sev=critical] { --c: var(--sev-critical); }
.sev.high, [data-sev=high] { --c: var(--sev-high); }
.sev.medium, [data-sev=medium] { --c: var(--sev-medium); }
.sev.low, [data-sev=low] { --c: var(--sev-low); }
.tag { display: inline-block; font: 500 .74rem/1.55 var(--sans); padding: 0 7px; border-radius: 5px; background: var(--sunken); color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.info { background: var(--accent-soft); color: var(--accent); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; padding: 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.filters select, .filters input { font: .88rem var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--rule-2); border-radius: 7px; padding: 6px 8px; }
.filters input { flex: 1 1 180px; min-width: 0; }
.count { color: var(--ink-3); font: .8rem var(--mono); margin-left: auto; }
details.finding { background: var(--surface); border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: 10px; margin: 0 0 10px; scroll-margin-top: 16px; }
details.finding[data-status=dismissed], details.finding[data-status=fixed] { opacity: .62; }
details.finding[open] { box-shadow: var(--shadow); }
details.finding > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; }
details.finding > summary::-webkit-details-marker { display: none; }
details.finding > summary .pick { margin-top: 5px; accent-color: var(--accent); width: 16px; height: 16px; }
.head .title { font-weight: 600; font-size: 1rem; }
.head .title .fid { font: 500 .78rem var(--mono); color: var(--ink-3); margin-right: 8px; }
.head .sub { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.chev { color: var(--ink-3); font-size: .78rem; margin-top: 4px; transition: transform .15s; }
details[open] > summary .chev { transform: rotate(90deg); }
.body { padding: 2px 18px 16px; border-top: 1px solid var(--rule); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.pair > div { padding: 12px 14px; border-radius: 8px; background: var(--paper); }
.pair > div.fail { background: color-mix(in srgb, var(--c) 9%, var(--surface)); }
.pair .lbl { display: block; margin-bottom: 4px; }
.body dl { display: grid; grid-template-columns: 9em minmax(0, 1fr); gap: 8px 16px; margin: 0; }
.body dt { font-size: .84rem; color: var(--ink-3); }
.body dd { margin: 0; min-width: 0; }
.fix { margin-top: 14px; padding: 10px 12px; border-left: 3px solid var(--ok); background: var(--ok-soft); border-radius: 0 8px 8px 0; }
.fix .lbl { color: var(--ok); display: block; margin-bottom: 2px; }
.rows { border-top: 1px solid var(--rule); }
.check { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; padding: 11px 2px; border-bottom: 1px solid var(--rule); align-items: baseline; }
.check .d { grid-column: 1 / -1; font-size: .86rem; color: var(--ink-2); }
button.btn { font: 500 .88rem var(--sans); padding: 7px 14px; border-radius: 8px; border: 1px solid var(--rule-2); background: var(--surface); color: var(--ink); cursor: pointer; }
button.btn:hover { border-color: var(--ink-3); }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.btn:disabled { opacity: .5; cursor: default; }
textarea { display: block; width: 100%; font: .92rem var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--rule-2); border-radius: 8px; padding: 8px 10px; resize: vertical; margin-top: 6px; }
.act { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--rule); }
.act .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.status { font-size: .85rem; color: var(--ink-2); }
.status.bad { color: var(--bad); }
.bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; width: min(1032px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--rule-2); border-radius: 12px; padding: 10px 14px; box-shadow: 0 10px 34px rgba(0, 0, 0, .16); z-index: 5; }
.bar .in { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar #picked { font-weight: 500; }
footer { color: var(--ink-3); font: .78rem var(--mono); margin-top: 24px; }

@media (max-width: 760px) {
  .masthead .in { padding: 22px 16px 18px; }
  .masthead h1 { font-size: 1.75rem; }
  .verdict { font-size: 1.12rem; }
  main { padding: 22px 16px 120px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats .stat:last-child { grid-column: 1 / -1; }
  .meta .sep { display: none; }
  .overview, .pair { grid-template-columns: 1fr; }
  .body { padding: 2px 12px 12px; }
  .body dl { grid-template-columns: 1fr; gap: 2px; }
  .body dd { margin-bottom: 8px; }
}
@media print {
  .filters, .act, .bar, .pick { display: none !important; }
  details.finding { break-inside: avoid; }
  details.finding > .body { display: block; }
}
</style>
</head>
<body>
<div id="app"><p class="empty" style="padding:24px">Loading review.js…</p></div>
<div class="bar" id="bar" hidden><div class="in">
  <span id="picked"></span>
  <button type="button" class="btn primary" data-action="plan-picked">Plan a fix for these</button>
  <button type="button" class="btn" data-action="clear">Clear</button>
  <span class="status" id="bar-status" role="status"></span>
</div></div>
<script>
'use strict';
// The report /naqsha:review wrote. Read-only, except that when served live you
// can send findings to Claude: plan a fix, say one isn't a problem, or ask.
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const KEY = new URLSearchParams(location.search).get('key');
const LIVE = /^https?:$/.test(location.protocol) && !!KEY;
const SEVERITIES = ['critical', 'high', 'medium', 'low'];
const AREAS = { security: 'Security', tests: 'Tests', dependencies: 'Dependencies', correctness: 'Correctness', reliability: 'Reliability', modularity: 'Modularity', data: 'Data and APIs', operability: 'Operability', performance: 'Performance', docs: 'Docs and setup', interface: 'Interface' };
let review = null;
let last = '';
const picked = new Set();
const open = new Set();
const drafts = {};
let filter = { severity: '', area: '', status: 'open', q: '' };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const txt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const arr = x => (Array.isArray(x) ? x : []);
const where = w => `<span class="file">${esc(w.path)}${w.line ? ':' + esc(w.line) : ''}</span>`;
const sevOf = s => (SEVERITIES.includes(s) ? s : 'low');
const sev = s => `<span class="sev ${sevOf(s)}">${esc(s || 'unrated')}</span>`;
const statusTag = s => `<span class="tag ${s === 'fixed' ? 'ok' : s === 'planned' ? 'info' : ''}">${esc(s)}</span>`;

// Filters are a per-viewer convenience, kept in this browser only.
const storeKey = () => 'naqsha-review:' + location.pathname;
function loadView() {
  try { const v = JSON.parse(localStorage.getItem(storeKey()) || 'null'); if (v) filter = { ...filter, ...v }; } catch { /* storage blocked */ }
}
function saveView() {
  try { localStorage.setItem(storeKey(), JSON.stringify(filter)); } catch { /* same */ }
}

function shown(f) {
  if (filter.severity && f.severity !== filter.severity) return false;
  if (filter.area && f.area !== filter.area) return false;
  if (filter.status && (f.status || 'open') !== filter.status) return false;
  if (filter.q) {
    const hay = [f.id, f.title, f.problem, f.failure, f.fix, f.pattern, ...arr(f.where).map(w => w.path)].join(' ').toLowerCase();
    if (!hay.includes(filter.q.toLowerCase())) return false;
  }
  return true;
}

function finding(f) {
  const status = f.status || 'open';
  const draft = drafts[f.id] || '';
  const ws = arr(f.where);
  return `<details class="finding" id="${esc(f.id)}" data-id="${esc(f.id)}" data-status="${esc(status)}" data-sev="${sevOf(f.severity)}"${open.has(f.id) ? ' open' : ''}>
    <summary>
      ${LIVE && status === 'open' ? `<input type="checkbox" class="pick" data-pick="${esc(f.id)}" aria-label="Pick ${esc(f.id)} to plan"${picked.has(f.id) ? ' checked' : ''}>` : '<span></span>'}
      <span class="head"><span class="title"><span class="fid">${esc(f.id)}</span>${txt(f.title)}</span>
        <span class="sub">${sev(f.severity)} <span class="tag">${esc(AREAS[f.area] || f.area)}</span>
          <span class="tag ${f.confidence === 'confirmed' ? 'ok' : ''}">${esc(f.confidence || 'likely')}</span>
          ${status !== 'open' ? statusTag(status) : ''}
          ${ws.slice(0, 2).map(where).join(' ')}${ws.length > 2 ? ` <span class="small muted">+${ws.length - 2}</span>` : ''}</span></span>
      <span class="chev">▶</span>
    </summary>
    <div class="body">
      <div class="pair">
        <div><span class="lbl">What’s wrong</span>${txt(f.problem) || '<span class="empty">not written</span>'}</div>
        <div class="fail"><span class="lbl">When it fails</span>${txt(f.failure) || '<span class="empty">no concrete case</span>'}</div>
      </div>
      <dl>
        <dt>Why ${esc(f.severity || '')}</dt><dd>${txt(f.severityWhy) || '<span class="empty">not given</span>'}</dd>
        <dt>Where</dt><dd>${ws.length ? `<ul class="marks skip" style="margin:0">${ws.map(w => `<li style="margin:2px 0">${where(w)}${w.what ? ` <span class="small">${txt(w.what)}</span>` : ''}</li>`).join('')}</ul>` : '<span class="empty">not given</span>'}${f.pattern ? `<p class="small muted" style="margin-top:6px">${txt(f.pattern)}</p>` : ''}</dd>
        <dt>How we know</dt><dd>${txt(f.evidence) || '<span class="empty">not given</span>'}</dd>
        ${f.history ? `<dt>History</dt><dd>${txt(f.history)}</dd>` : ''}
        <dt>Rule</dt><dd class="small">${txt(f.rule) || '<span class="empty">none named</span>'}</dd>
        ${f.statusNote ? `<dt>${status === 'dismissed' ? 'Dismissed because' : status === 'planned' ? 'Plan' : 'Note'}</dt><dd>${txt(f.statusNote)}</dd>` : ''}
      </dl>
      <div class="fix"><span class="lbl">Fix, in short</span>${txt(f.fix) || '<span class="empty">not given</span>'}</div>
      ${LIVE ? `<div class="act">
        <label for="note-${esc(f.id)}" class="status">Tell Claude about ${esc(f.id)}: why it isn’t a problem, or a question</label>
        <textarea id="note-${esc(f.id)}" rows="2" data-note="${esc(f.id)}">${esc(draft)}</textarea>
        <div class="row">
          ${status === 'open' ? `<button type="button" class="btn primary" data-action="plan" data-id="${esc(f.id)}">Plan a fix</button>
          <button type="button" class="btn" data-action="dismiss" data-id="${esc(f.id)}">Not a problem</button>` : ''}
          <button type="button" class="btn" data-action="ask" data-id="${esc(f.id)}">Ask</button>
          <span class="status" data-status="${esc(f.id)}" role="status"></span>
        </div>
      </div>` : ''}
    </div>
  </details>`;
}

function render(r) {
  const m = r.meta || {};
  const s = r.summary || {};
  const fs = arr(r.findings);
  const byId = Object.fromEntries(fs.map(f => [f.id, f]));
  const openOnes = fs.filter(f => (f.status || 'open') === 'open');
  document.title = (m.title || 'Review') + ' · review';
  const list = fs.filter(shown);
  const option = (v, label, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(label)}</option>`;
  const n = v => openOnes.filter(f => sevOf(f.severity) === v).length;
  const meta = [m.date, m.commit && `commit <code>${esc(m.commit)}</code>`, m.depth && `${esc(m.depth)} depth`, m.purpose && `for ${esc(m.purpose)}`, m.scope && esc(m.scope),
    m.map && `map: <span class="file">${esc(m.map)}</span>`].filter(Boolean);
  const checks = arr(r.checks);
  app.innerHTML = `
    <header class="masthead"><div class="in">
      <span class="eyebrow">naqsha · codebase review</span>
      <h1>${txt(m.title || 'Codebase review')}</h1>
      <div class="meta">${meta.map((x, i) => `${i ? '<span class="sep">/</span>' : ''}<span>${i === 0 ? esc(x) : x}</span>`).join('')}</div>
      <p class="verdict">${txt(s.verdict) || '<span class="empty">No verdict yet.</span>'}</p>
    </div></header>
    <main>
    <section class="sec" aria-labelledby="h-summary">
      <div class="sec-h"><h2 id="h-summary">Summary</h2><span class="eyebrow">${openOnes.length} open of ${fs.length}</span></div>
      ${openOnes.length ? `<div class="sevbar" aria-hidden="true">${SEVERITIES.filter(n).map(v => `<i data-sev="${v}" style="flex:${n(v)};background:var(--c)"></i>`).join('')}</div>` : ''}
      <div class="stats">${SEVERITIES.map(v => `<button type="button" class="stat" data-sev-filter="${v}"><b>${n(v)}</b><span data-sev="${v}"><i style="background:var(--c)"></i>${v} open</span></button>`).join('')}
        <button type="button" class="stat" data-sev-filter=""><b>${fs.length - openOnes.length}</b><span>dismissed, planned or fixed</span></button></div>
      <div class="overview">
        <div>
          ${s.planFirst ? `<div class="callout"><span class="lbl">Plan first</span>${txt(s.planFirst)}</div>` : ''}
          ${arr(s.topRisks).length ? `<h3>Top risks</h3><ol class="top">${arr(s.topRisks).map(id => `<li><span><a href="#${esc(id)}" data-open="${esc(id)}">${byId[id] ? txt(byId[id].title) : esc(id)}</a>
            <span style="display:flex;gap:6px;margin-top:4px">${byId[id] ? sev(byId[id].severity) : ''}<span class="small muted" style="font-family:var(--mono)">${esc(id)}</span></span></span></li>`).join('')}</ol>` : ''}
        </div>
        <div>
          ${arr(s.strengths).length ? `<h3>What it does well</h3><ul class="marks yes">${arr(s.strengths).map(x => `<li>${txt(x.text || x)}${x.where ? ` <span class="file">${esc(x.where)}</span>` : ''}</li>`).join('')}</ul>` : ''}
          <h3 style="margin-top:22px">Not checked</h3>${arr(s.notChecked).length ? `<ul class="marks skip">${arr(s.notChecked).map(x => `<li class="muted">${txt(x)}</li>`).join('')}</ul>` : '<p class="empty">Nothing listed.</p>'}
        </div>
      </div>
    </section>
    <section class="sec" aria-labelledby="h-findings">
      <div class="sec-h"><h2 id="h-findings">Findings</h2>${LIVE ? '<span class="small muted">Tick findings to plan fixes for several together</span>' : ''}</div>
      <div class="filters" role="search">
        <select data-filter="severity" aria-label="Severity">${option('', 'Any severity', filter.severity)}${SEVERITIES.map(v => option(v, v, filter.severity)).join('')}</select>
        <select data-filter="area" aria-label="Area">${option('', 'Any area', filter.area)}${[...new Set(fs.map(f => f.area))].map(a => option(a, AREAS[a] || a, filter.area)).join('')}</select>
        <select data-filter="status" aria-label="Status">${option('', 'Any status', filter.status)}${['open', 'planned', 'dismissed', 'fixed'].map(v => option(v, v, filter.status)).join('')}</select>
        <input type="search" data-filter="q" placeholder="Search findings or paths" aria-label="Search findings" value="${esc(filter.q)}">
        <span class="count">${list.length} of ${fs.length}</span>
      </div>
      ${list.length ? list.map(finding).join('') : `<p class="empty">${fs.length ? 'No findings match these filters.' : 'No findings.'}</p>`}
    </section>
    <section class="sec" aria-labelledby="h-checks">
      <div class="sec-h"><h2 id="h-checks">Checks that ran</h2>${checks.length ? `<span class="eyebrow">${checks.filter(c => c.status === 'pass').length} of ${checks.length} passed</span>` : ''}</div>
      ${checks.length ? `<div class="rows">${checks.map(c => `<div class="check">
        <div><b style="font-weight:500">${txt(c.check)}</b>${c.command ? ` <code>${esc(c.command)}</code>` : ''}</div>
        <span class="tag ${c.status === 'pass' ? 'ok' : c.status === 'fail' ? 'bad' : ''}">${esc(c.status)}</span>
        <div class="d">${txt(c.result)}${arr(c.details).length ? `<ul class="marks skip" style="margin-top:4px">${arr(c.details).map(d => `<li style="margin:2px 0"><code>${esc(d)}</code></li>`).join('')}</ul>` : ''}</div></div>`).join('')}</div>` : '<p class="empty">No checks recorded.</p>'}
    </section>
    <footer>${LIVE ? 'Live: this page updates as Claude records your choices.' : 'Opened from a file: read-only. Run /naqsha:review to send findings to Claude.'}</footer>
    </main>`;
  updateBar();
}

function updateBar() {
  bar.hidden = !LIVE || !picked.size;
  document.getElementById('picked').textContent = `${picked.size} picked: ${[...picked].join(', ')}`;
}

async function send(message, out) {
  out.textContent = 'Sending…';
  out.className = 'status';
  try {
    const r = await fetch('submit?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });
    if (!r.ok) throw new Error(await r.text());
    out.textContent = 'Sent. Claude answers in your terminal.';
    return true;
  } catch (e) {
    out.textContent = `Not sent: ${e.name === 'TypeError' ? 'the page server isn’t running' : e.message}. Say it in the terminal instead.`;
    out.className = 'status bad';
    return false;
  }
}

async function act(kind, id) {
  const f = arr(review.findings).find(x => x.id === id);
  const out = app.querySelector(`[data-status="${CSS.escape(id)}"]`);
  const note = (drafts[id] || '').trim();
  const head = `[Review · ${id} ${f ? f.title : ''}]`;
  if (kind !== 'plan' && !note) {
    out.textContent = kind === 'dismiss' ? 'Say why it isn’t a problem first.' : 'Write your question first.';
    out.className = 'status bad';
    return;
  }
  const message = kind === 'plan' ? `${head} Plan a fix.${note ? ' ' + note : ''}`
    : kind === 'dismiss' ? `${head} Not a problem: ${note}` : `${head} ${note}`;
  if (await send(message, out)) delete drafts[id];
}

app.addEventListener('click', e => {
  const link = e.target.closest('[data-open]');
  if (link) {
    e.preventDefault();
    const id = link.dataset.open;
    open.add(id);
    if (filter.status && filter.status !== ((arr(review.findings).find(f => f.id === id) || {}).status || 'open')) filter.status = '';
    render(review);
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start' });
    return;
  }
  const st = e.target.closest('[data-sev-filter]');
  if (st) {
    filter.severity = st.dataset.sevFilter;
    filter.status = st.dataset.sevFilter ? 'open' : '';
    saveView();
    render(review);
    document.getElementById('h-findings').scrollIntoView({ block: 'start' });
    return;
  }
  const b = e.target.closest('button[data-action]');
  if (b && b.dataset.id) act(b.dataset.action, b.dataset.id);
});
app.addEventListener('toggle', e => {
  const d = e.target;
  if (d.matches && d.matches('details.finding')) d.open ? open.add(d.dataset.id) : open.delete(d.dataset.id);
}, true);
app.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pick) { t.checked ? picked.add(t.dataset.pick) : picked.delete(t.dataset.pick); updateBar(); return; }
  if (t.dataset.filter && t.tagName === 'SELECT') { filter[t.dataset.filter] = t.value; saveView(); render(review); }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.note) drafts[t.dataset.note] = t.value;
  if (t.dataset.filter === 'q') {
    filter.q = t.value;
    saveView();
    const pos = t.selectionStart;
    render(review);
    const box = app.querySelector('[data-filter=q]');
    box.focus();
    box.setSelectionRange(pos, pos);
  }
});
bar.addEventListener('click', async e => {
  const b = e.target.closest('button[data-action]');
  if (!b) return;
  if (b.dataset.action === 'clear') { picked.clear(); render(review); return; }
  const ids = [...picked];
  if (await send(`[Review] Plan a fix for ${ids.join(', ')} together.`, document.getElementById('bar-status'))) { picked.clear(); updateBar(); }
});

// file:// pages can't fetch(), but they can load a script, so poll review.js.
function load() {
  const s = document.createElement('script');
  s.src = 'review.js?t=' + Date.now() + (KEY ? '&key=' + encodeURIComponent(KEY) : '');
  s.onload = s.onerror = () => {
    s.remove();
    const r = window.NAQSHA_REVIEW;
    const now = r ? JSON.stringify(r) : '';
    if (!now || now === last) return;
    if (!review) loadView();
    last = now;
    review = r;
    for (const id of picked) if (((arr(r.findings).find(f => f.id === id) || {}).status || 'open') !== 'open') picked.delete(id);
    const y = scrollY;
    // Don't redraw under someone typing; the next poll catches up.
    if (document.activeElement && document.activeElement.matches('textarea')) { last = ''; return; }
    render(r);
    scrollTo(0, y);
  };
  document.head.appendChild(s);
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
