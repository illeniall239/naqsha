      ${c.system ? `<p><span class="lbl">Where it lives</span>${txt(c.system)}</p>` : ''}
      <h3>Tokens in use</h3>${table(c.tokens, [['Name', x => `<code>${esc(x.name)}</code>`], ['Value', x => esc(x.value)], ['Where', x => `<span class="file">${esc(x.where)}</span>`]])}
      <h3>Components</h3>${table(c.components, [['Component', x => txt(x.name)], ['Where', x => `<span class="file">${esc(x.where)}</span>`], ['States', x => txt(x.states)]])}
      ${c.fonts || c.icons || c.motion ? `<p style="margin-top:12px">${[c.fonts && `<span class="lbl">Fonts</span>${txt(c.fonts)}`, c.icons && `<span class="lbl">Icons</span>${txt(c.icons)}`, c.motion && `<span class="lbl">Motion</span>${txt(c.motion)}`].filter(Boolean).join(' · ')}</p>` : ''}
      <h3>Design debt</h3>${marks(c.debt, 'no')}`;
  }],
  ['tokens', 'Tokens', p => {
    const t = p.tokens || {};
    const colors = arr(t.color);
    const bg = (colors.find(c => slugOf(c.name) === 'bg') || colors.find(c => /background/i.test(c.role)) || {}).value;
    const type = t.type || {};
    const specimen = arr(type.families).map(f => `<p style="font-family:var(--font-${slugOf(String(f.role || '').split(/\s+/)[0])});font-size:22px;margin:0 0 4px">${esc(f.name)} · ${esc(f.role)}</p>`).join('') +
      arr(type.scale).map(x => `<p style="margin:12px 0 0;font:var(--weight-${slugOf(x.name)}) var(--size-${slugOf(x.name)})/var(--leading-${slugOf(x.name)}) var(--font-body,system-ui)">${esc(x.name)} · ${esc(x.size)}/${esc(x.lineHeight)} · Every screen in every state, before any code.</p>`).join('');
    return `<h3>Color</h3><div class="swatches">${colors.map(c => {
        const ratio = bg && c.value !== bg ? contrast(c.value, bg) : null;
        return `<div class="swatch"><div class="chipc" style="background:${esc(cssValue(c.value))}"></div><b>${esc(c.name)}</b> <code>${esc(c.value)}</code><small>${txt(c.role)}</small>${
          ratio ? `<small class="${ratio < 4.5 && /text/i.test(c.role) ? 'low' : ''}">${ratio.toFixed(2)}:1 on bg${ratio < 4.5 && /text/i.test(c.role) ? ': too low for text (4.5:1)' : ''}</small>` : ''}</div>`;
      }).join('') || empty}</div>
      ${arr(t.dark).length ? `<h3>Dark theme overrides</h3>${list(t.dark, c => `<code>${esc(c.name)}</code> ${esc(c.value)}`)}` : ''}
      <h3>Type</h3>${specimen ? frame(frameDoc(p, `<div style="padding:24px">${specimen}</div>`), 'Type specimen', 'tablet') : empty}
      <h3>Space, radius, shadow, motion</h3>
      <p>${arr(t.space).map(v => `<code>${esc(v)}</code>`).join(' ') || '<span class="muted">No spacing scale.</span>'}</p>
      ${list([...arr(t.radius).map(r => `radius ${r.name}: ${r.value}`), ...arr(t.shadow).map(r => `shadow ${r.name}: ${r.value}`), ...Object.entries(t.motion || {}).map(([k, v]) => `motion ${k}: ${v}`)])}`;
  }],
  ['screens', 'Screens', (p, ask) => {
    const screens = arr(p.screens);
    if (!screens.length) return empty;
    const dark = arr((p.tokens || {}).dark).length;
    return `${sizeBar(dark)}
      ${screens.map(sc => screenHtml(p, sc, ask)).join('')}`;
  }],
  ['steps', 'Implementation steps', p => {
    if (!has(p.steps) || isNa(p.steps)) return empty;
    const n = st => p.steps.filter(s => (STEP_STATES.includes(s.status) ? s.status : 'todo') === st).length;
    return `<div class="legend">${STEP_STATES.filter(n).map(st => `<span class="st-${st}"><i></i>${n(st)} ${st === 'todo' ? 'to do' : st}</span>`).join('')}
        <span style="margin-left:auto"><button type="button" class="link" data-steps="open">Open all</button> · <button type="button" class="link" data-steps="close">Close all</button></span></div>
      <ol class="timeline">${p.steps.map(x => stepHtml(p, x)).join('')}</ol>`;
  }],
  // Measured from Claude Code's logs by `plan-tool.js cost`, after each step.
  ['cost', 'What it cost', p => {
    const c = p.cost;
    if (!c || !c.total) return '<p class="na">Not measured yet. Claude measures it after each step, or ask for it any time.</p>';
    const pct = n => `${Math.round(100 * (n || 0) / c.total)}%`;
    const parts = [['Planning', c.planning], ...Object.entries(c.steps || {}), ...(c.between && c.between.weight ? [['Between steps', c.between]] : [])].filter(([, b]) => b);
    const max = Math.max(1, ...parts.map(([, b]) => b.weight || 0));
    return `<div class="stats">
        <div class="stat"><span class="k">Total</span><b>${kilo(c.total)}</b><span class="s">weighted tokens</span></div>
        ${Object.entries(c.byModel || {}).map(([m, v]) => `<div class="stat"><span class="k">${esc(m)}</span><b>${kilo(v)}</b><span class="s">${pct(v)}</span></div>`).join('')}
      </div>
      <h3>Where it went</h3>${rows(parts, ([name, b]) => ['', `<b>${esc(name)}</b><div class="hbar"><i style="width:${(100 * (b.weight || 0) / max).toFixed(1)}%"></i></div>`,
        `${kilo(b.weight)} <span class="faint">${pct(b.weight)}</span>`, esc(Object.entries(b.byModel || {}).map(([m, v]) => `${m} ${kilo(v)}`).join(', '))], false)}
      <h3>Agents, costliest first</h3>${rows(c.agents, x => ['', txt(x.name), `${kilo(x.weight)} <span class="faint">· ${esc(x.calls)} calls</span>`, `${esc(x.where)} · ${esc(x.model)}`], false)}
      <p class="faint small" style="margin-top:12px">Weighted tokens count a cached read as ${esc(c.weights.cacheRead)}, a cache write as ${esc(c.weights.cacheWrite5m)} to ${esc(c.weights.cacheWrite1h)} and output as ${esc(c.weights.output)} fresh input tokens.
        Sonnet and Haiku cost less per token than Opus, so compare within a model. Measured ${esc(String(c.at || '').slice(0, 16).replace('T', ' '))}.</p>`;
  }],
  // A demo (meta.kind "demo", from /naqsha:demo): its storylines, the storyboard and the video.
  ['storylines', 'Storylines', p => {
    const sls = arr(p.storylines);
    if (!sls.length) return '<p class="na">Storylines come after the brief: three different films, each with a clip of how it opens.</p>';
    const dec = arr(p.decisions).find(d => arr(d.options).some(o => o.storyline));
    const chosen = dec && dec.status === 'decided' ? (arr(dec.options).find(o => o.name === dec.choice) || {}).storyline : null;
    return `${dec && dec.status !== 'decided' ? `<p class="muted small" style="margin-bottom:12px">Watch each opening, then pick one in <a href="#${esc(dec.id)}">Questions</a>.</p>` : ''}
      <div class="cards two">${sls.map(s => `<div class="card" id="sl-${esc(s.id)}">
        <div class="card-h">${idChip(s.id)}<span class="title">${txt(s.name)}</span><span style="flex:1"></span>${s.id === chosen ? '<span class="pill st-done">chosen</span>' : s.recommended ? '<span class="pill st-rec plain">recommended</span>' : ''}</div>
        ${storylineBody(s)}${clip(s.clip)}</div>`).join('')}</div>`;
  }],
  ['scenes', 'Storyboard', p => {
    const st = p.story || {};
    let at = 0;
    // The composer writes each scene's real start (transitions can overlap scenes).
    const scenes = arr(p.scenes).map(sc => { const from = typeof sc.at === 'number' ? sc.at : at; at = from + (Number(sc.seconds) || 0); return { ...sc, from }; });
    const mmss = t => `${Math.floor(t / 60)}:${String(Math.round(t % 60)).padStart(2, '0')}`;
    return `${st.hook ? `<div class="lede out"><span class="eyebrow">Hook</span><p>${txt(st.hook)}</p></div>` : ''}
      <p class="muted small" style="margin:14px 0">${scenes.length} scenes · ${mmss(at)}${p.meta && p.meta.length ? ` of a ${esc(p.meta.length)} s target` : ''}${p.meta && p.meta.formats ? ` · ${esc(arr(p.meta.formats).join(', '))}` : ''}</p>
      <div class="scenes">${scenes.map(x => `<div class="card scene" id="scene-${esc(x.id)}">
        <div class="card-h">${idChip(x.id)}<span class="time">${esc(mmss(x.from))} · ${esc(x.seconds)} s</span></div>
        <div class="time" style="margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${(x.make && x.make.type) || x.kind ? `<span class="tag">${esc((x.make && x.make.type) || x.kind)}</span>` : ''}${x.transition ? `<span>enters by ${esc(typeof x.transition === 'string' ? x.transition : x.transition.type || 'cut')}</span>` : ''}</div>
        <div class="small">${txt(x.shows)}</div>
        ${x.caption ? `<div class="cap">“${txt(x.caption)}”</div>` : ''}
        ${x.notes ? `<div class="foot">${txt(x.notes)}</div>` : ''}</div>`).join('')}</div>`;
  }],
  ['video', 'Video', p => {
    const r = arr(p.renders);
    if (!r.length) return '<p class="na">Not rendered yet. Production starts when you approve the storyboard.</p>';
    const q = KEY ? `?key=${encodeURIComponent(KEY)}` : '';
    const safe = f => /^renders\/[A-Za-z0-9][A-Za-z0-9._-]*$/.test(f || '') ? esc(f) + q : '';
    const cur = r.find(x => x.format === videoFormat) || r[0];
    let at = 0;
    const chapters = arr(p.scenes).map(sc => { const from = typeof sc.at === 'number' ? sc.at : at; at = from + (Number(sc.seconds) || 0); return { id: sc.id, caption: sc.caption || sc.shows, from }; });
    return `<div class="frames-bar" role="group" aria-label="Format">${r.map(x => `<button type="button" data-format="${esc(x.format)}" aria-pressed="${x === cur}">${esc(x.format)}</button>`).join('')}</div>
      <video id="demo-video" controls preload="metadata" playsinline style="width:100%;max-height:70vh;background:#000;border-radius:10px"${p.poster && safe(p.poster) ? ` poster="${safe(p.poster)}"` : ''} src="${safe(cur.file)}">
        ${p.captions && /\.vtt$/.test(p.captions) && safe(p.captions) ? `<track kind="captions" src="${safe(p.captions)}" default>` : ''}</video>
      <p class="muted small" style="margin-top:8px">${esc(cur.format)} · ${esc(cur.seconds)} s · <a href="${safe(cur.file)}" download>Download</a>${p.captions && safe(p.captions) ? ` · <a href="${safe(p.captions)}" download>Captions</a>` : ''}</p>
      ${asking(p) || LIVE ? '<p><button type="button" data-action="stamp">Comment at this moment</button> <span class="muted small">pauses the video and adds its time to your comment on this section</span></p>' : ''}
      ${chapters.length ? `<h3>Scenes</h3>${rows(chapters, c => [c.id, `<button type="button" class="link" data-seek="${c.from}">${Math.floor(c.from / 60)}:${String(Math.round(c.from % 60)).padStart(2, '0')}</button> ${txt(c.caption)}`, ''])}` : ''}
      ${arr(p.qa).length ? `<h3>Checks</h3>${rows(p.qa, x => ['', txt(x.check), '', txt(x.result)], false)}` : ''}`;
  }],
  ['needsYou', 'Needs you', p => Array.isArray(p.needsYou) && !p.needsYou.length ? '<p class="na">Nothing. Claude can do all of it.</p>' :
    rows(p.needsYou, x => ['', `<b>${txt(x.what)}</b>`, x.when ? `<span class="tag">${txt(x.when)}</span>` : '', txt(x.why)], false)],
  ['risks', 'Risks', p => {
    if (isNa(p.risks)) return na(p.risks);
    const rs = arr(p.risks).map(r => ({ ...r, l: lv(r.likelihood), i: lv(r.impact) })).map(r => ({ ...r, s: r.l * r.i }));
    if (!rs.length) return empty;
    const heat = s => (s >= 6 ? 3 : s >= 3 ? 2 : 1);
    const cells = [3, 2, 1].map(l => `<span class="ax y">${lvName(l)}</span>${[1, 2, 3].map(i => {
      const n = rs.filter(r => r.l === l && r.i === i).length;
      return `<span class="cell h${heat(l * i)}${n ? ' has' : ''}" title="${lvName(l)} likelihood, ${lvName(i)} impact">${n || ''}</span>`;
    }).join('')}`).join('');
    return `<div class="risk-wrap">
      <div><div class="matrix" aria-label="Risks by likelihood and impact">${cells}<span></span><span class="ax">low</span><span class="ax">med</span><span class="ax">high</span><span class="cap">impact →</span></div>
        <p class="faint small" style="margin-top:6px">Rows: likelihood. Darker means worse.</p></div>
      <div>${rs.sort((a, b) => b.s - a.s || b.i - a.i).map(r => `<div class="risk h${heat(r.s)}">
        <div class="r">${txt(r.risk)}</div>
        <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="pill plain lv-${lvName(r.l)}">${esc(cap(r.likelihood || '?'))} likelihood</span><span class="pill plain lv-${lvName(r.i)}">${esc(cap(r.impact || '?'))} impact</span></div>
        ${r.mitigation ? `<div class="m"><span class="lbl">Mitigation</span>${txt(r.mitigation)}</div>` : ''}</div>`).join('')}</div></div>`;
  }],
  ['later', 'Later milestones', p => Array.isArray(p.later) && p.later.length
    ? `<p class="muted small" style="margin-bottom:12px">Left for later plans, each its own /naqsha:plan once this one is built.</p><div class="cards two">${p.later.map(x => `<div class="card"><div class="card-h"><span class="title">${txt(x.title)}</span></div><p>${txt(x.adds)}</p><div class="foot">${txt(x.why)}</div></div>`).join('')}</div>`
    : '<p class="na">Nothing deferred: this plan covers the whole request.</p>'],
  ['rejected', 'Deliberately not doing', p => isNa(p.rejected) ? na(p.rejected) : !arr(p.rejected).length ? empty
    : `<ul class="marks no">${p.rejected.map(x => `<li><b style="font-weight:500">${txt(x.option)}</b><div class="small muted">${txt(x.why)}</div></li>`).join('')}</ul>`],
  ['changelog', 'Change log', p => isNa(p.changelog) ? na(p.changelog) : !arr(p.changelog).length ? empty
    : `<ul class="log">${[...p.changelog].reverse().map(x => `<li><span class="d">${esc(x.date)}</span><span>${txt(x.change)}</span><span class="tag">${esc(x.by)}</span></li>`).join('')}</ul>`],
];

// ---- tabs and phases --------------------------------------------------------

// The plan reads in parts instead of one long scroll. Questions get a tab of
// their own and are asked in phases.
const TABS = [
  ['overview', 'Overview', ['summary', 'needsYou', 'risks', 'later']],
  ['questions', 'Questions', []],
  ['requirements', 'Requirements', ['requirements']],
  ['research', 'Research', ['context', 'priorArt', 'research']],
  ['decisions', 'Decisions', ['decisions', 'rejected']],
  ['architecture', 'Architecture', ['architecture', 'dependencies', 'impact']],
  ['quality', 'Quality', ['quality']],
  ['security', 'Security', ['security']],
  ['build', 'Build', ['steps', 'testing', 'cost']],
  ['log', 'Change log', ['changelog']],
];
let videoFormat = null;
const DEMO_TABS = [
  ['overview', 'Overview', ['summary']],
  ['questions', 'Questions', []],
  ['storylines', 'Storylines', ['storylines']],
  ['story', 'Storyboard', ['scenes']],
  ['style', 'Choices', ['decisions']],
  ['video', 'Video', ['video']],
  ['log', 'Change log', ['changelog']],
];
// A design (meta.kind "design", from /naqsha:design) reads in its own tabs.
const DESIGN_TABS = [
  ['overview', 'Overview', ['summary', 'needsYou', 'risks', 'later']],
  ['questions', 'Questions', []],
  ['direction', 'Direction', ['current', 'direction', 'decisions', 'impact']],
  ['tokens', 'Tokens', ['tokens']],
  ['screens', 'Screens', ['screens']],
  ['build', 'Build', ['steps', 'testing', 'cost']],
  ['log', 'Change log', ['changelog']],
];
const SECTION = Object.fromEntries(SECTIONS.map(x => [x[0], x]));

// Which tab and phase are showing: a per-viewer convenience, so it lives in
// this browser only.
let activeTab = null;
let activePhase = null;
const uiKey = () => storeKey() + ':view';
function loadView() {
  try {
    const v = JSON.parse(localStorage.getItem(uiKey()) || 'null');
    if (v) { activeTab = v.tab || null; activePhase = Number.isInteger(v.phase) ? v.phase : null; }
  } catch { /* storage blocked: start from the defaults */ }
}
function saveView() {
  try { localStorage.setItem(uiKey(), JSON.stringify({ tab: activeTab, phase: activePhase })); } catch { /* same */ }
}

// Questions and decisions, grouped by the phase Claude gave each. Without
// one, questions and decisions each form a phase of their own.
function phasesOf(p) {
  const phases = [];
  const add = (kind, item, open) => {
    const title = String(item.phase || (kind === 'd' ? 'Decisions' : 'Questions'));
    let ph = phases.find(x => x.title === title);
    if (!ph) phases.push(ph = { title, items: [] });
    ph.items.push({ kind, item, open });
  };
  for (const q of Array.isArray(p.questions) ? p.questions : []) add('q', q, q.status !== 'answered');
  for (const d of Array.isArray(p.decisions) ? p.decisions : []) add('d', d, d.status !== 'decided');
  return phases;
}
const settled = it => !it.open || answered(draft.answers[it.item.id]);
const firstOpenPhase = phases => Math.max(0, phases.findIndex(ph => ph.items.some(it => !settled(it))));

function questionsTab(p, ask) {
  const phases = phasesOf(p);
  if (!phases.length) return '<p class="na">No questions yet.</p>';
  if (activePhase === null || activePhase >= phases.length) activePhase = firstOpenPhase(phases);
  const item = it => it.kind === 'q' ? question(it.item, ask) : decision(it.item, ask);
  const stepper = phases.map((ph, i) => {
    const open = ph.items.filter(it => it.open).map(it => it.item.id);
    return `<li><button type="button" class="phase${i === activePhase ? ' current' : ''}" data-phase="${i}"
      data-open="${esc(open.join(' '))}" data-total="${ph.items.length}" aria-current="${i === activePhase ? 'step' : 'false'}">
      <span class="num">${i + 1}</span><span>${esc(ph.title)}</span><span class="k"></span></button></li>`;
  }).join('');
  const panels = phases.map((ph, i) => {
    const open = ph.items.filter(it => it.open);
    const closed = ph.items.filter(it => !it.open);
    const prev = i > 0 ? `<button type="button" data-phase="${i - 1}">← ${esc(phases[i - 1].title)}</button>` : '<span></span>';
    const next = i < phases.length - 1 ? `<button type="button" class="primary" data-phase="${i + 1}">Next: ${esc(phases[i + 1].title)} →</button>`
      : ask ? '<span class="muted small">Last phase. Send your answers with the bar below.</span>' : '<span></span>';
    return `<div data-phase-panel="${i}"${i === activePhase ? '' : ' hidden'}>
      <div class="sec-h"><h2>${esc(ph.title)}</h2><span class="eyebrow">Phase ${i + 1} of ${phases.length}</span></div>
      ${open.length ? open.map(item).join('') : '<p class="na">Nothing open in this phase.</p>'}
      ${closed.length ? `<details class="answered"${open.length ? '' : ' open'}><summary>Answered earlier (${closed.length})</summary>${closed.map(item).join('')}</details>` : ''}
      <div class="phase-nav">${prev}${next}</div></div>`;
  }).join('');
  const recommend = ask && openItems(p).some(d => d.recommendation)
    ? '<p style="margin-bottom:18px"><button type="button" data-action="recommend">Use the recommendation wherever I haven’t answered</button></p>' : '';
  return `<ol class="phases" aria-label="Question phases">${stepper}</ol>${recommend}${panels}`;
}

const commentButton = (id, ask) => ask ? `<button type="button" class="link" data-toggle="${id}">Comment</button>` : '';
const commentBox = (id, ask) => ask ? `<textarea data-comment="${id}" rows="3" placeholder="Your comment on this section" aria-label="Comment on this section" style="margin:0 0 14px"${
  opened.has(id) || (draft.comments[id] || '').trim() ? '' : ' hidden'}></textarea>` : '';
const sectionHtml = (p, ask, id) => {
  const [, title, f] = SECTION[id];
  return `<section class="sec" id="${id}"><div class="sec-h"><h2>${title}</h2>${commentButton(id, ask)}</div>${commentBox(id, ask)}${present(p, id) ? f(p, ask) : empty}</section>`;
};

function overviewTop(p, ask) {
  const m = p.meta || {};
  const open = openItems(p);
  const phases = phasesOf(p);
  // Claude writes plan.js, so a risk marked as accepted is shown to the user
  // up front, to confirm it really was their call.
  const accepted = p.security && !isNa(p.security) && Array.isArray(p.security.threats)
    ? p.security.threats.filter(t => t.acceptedBy === 'user') : [];
  const steps = Array.isArray(p.steps) ? p.steps : [];
  const size = buildSize(p);
  const needs = Array.isArray(p.needsYou) ? p.needsYou.length : 0;
  const toAnswer = open.filter(d => !answered(draft.answers[d.id])).length;
  const inPhases = phases.filter(ph => ph.items.some(it => !settled(it))).length;
  const waitingLine = toAnswer
    ? `${toAnswer} question${toAnswer > 1 ? 's' : ''} to answer, in ${inPhases} phase${inPhases > 1 ? 's' : ''}${open.length > toAnswer ? `; ${open.length - toAnswer} answered here, waiting to be sent or recorded` : ''}.`
    : `All ${open.length} answered here, waiting to be sent or recorded.`;
  const kindStats = m.kind === 'demo' ? '' : `<section class="sec"><div class="sec-h"><h2>Build size</h2></div>
      <div class="stats">
        <div class="stat"><span class="k">Steps</span><b>${size.steps}</b><span class="s">effort: ${esc(size.effort)}</span></div>
        <div class="stat"><span class="k">Independent reviews</span><b>~${size.reviewed}</b><span class="s">plus the finish review</span></div>
        <div class="stat"><span class="k">App runs</span><b>~${size.runs}</b><span class="s">driven like a user</span></div>
        <div class="stat"><span class="k">Needs you</span><b>${needs ? `<a href="#needsYou" style="color:inherit">${needs}</a>` : '0'}</b><span class="s">${needs ? `item${needs > 1 ? 's' : ''} only you can do` : 'Claude can do all of it'}</span></div>
      </div>
      <p class="faint small" style="margin-top:10px">Claude builds the code, so the size is counted in its work, not in developer hours; the calendar time that remains is what needs you.</p></section>`;
  return `
    ${open.length ? `<div class="callout warn"><div><h2>Waiting on you</h2>
      <p class="small">${waitingLine}
        ${ask ? 'Answer them in Questions, then press <b>Send to Claude</b>. You can also answer in the terminal.'
          : m.status === 'draft' ? 'Answer them in the terminal, or ask Claude for the live page link to answer here.' : ''}</p></div>
      <button type="button" class="primary" data-tab="questions">Go to the questions →</button></div>`
    : ask && m.kind !== 'demo' ? `<div class="callout info"><h2>Ready for your review</h2><p class="small">Read the plan, tab by tab. To change anything, comment on a section and send it to Claude.
      When you’re happy, type <code>/naqsha:approve</code> in Claude Code. Approval is only that command.</p></div>` : ''}
    ${accepted.length && m.status === 'draft' ? `<div class="callout bad"><h2>Risks marked as accepted by you</h2>
      <p class="small">These threats will not be mitigated. Approving the plan accepts them. If one wasn’t your decision, say so before you approve.</p>
      ${marks(accepted, 'no', t => `<a class="ref" href="#thr-${esc(t.id)}">${esc(t.id)}</a> ${txt(t.threat)}<br><span class="muted small">Your reason: ${txt(t.acceptedReason)}</span>`)}</div>` : ''}
    ${p.summary ? sectionHtml(p, ask, 'summary') : ''}
    ${steps.length || m.kind !== 'demo' ? kindStats : ''}`;
}

function masthead(p) {
  const m = p.meta || {};
  const steps = isNa(p.steps) ? [] : arr(p.steps);
  const done = steps.filter(s => s.status === 'done').length;
  const kind = m.kind === 'new-app' ? 'New app plan' : m.kind === 'design' ? `Design${m.approach ? ` · ${m.approach}` : ''}` : m.kind === 'demo' ? 'Demo' : 'Feature plan';
  const open = openItems(p).length;
  const right = m.kind === 'demo' ? '' : steps.length && m.status !== 'draft'
    ? `<div class="progress-box"><div class="nums"><span class="eyebrow">Build progress</span><span><b>${done}</b> <span class="muted">/ ${steps.length} step${steps.length === 1 ? '' : 's'}</span></span></div>
        <div class="segbar">${steps.map(s => `<a class="seg st-${STEP_STATES.includes(s.status) ? s.status : 'todo'}" href="#${esc(s.id)}" title="${esc(s.id)} · ${esc(s.title)} · ${esc(s.status || 'todo')}"></a>`).join('')}</div></div>`
    : m.status === 'draft' ? `<div class="progress-box"><div class="nums"><span class="eyebrow">Planning</span><span><b>${open}</b> <span class="muted">open question${open === 1 ? '' : 's'}</span></span></div>
        <div class="segbar">${phasesOf(p).flatMap(ph => ph.items).map(it => `<span class="seg ${settled(it) ? 'st-done' : ''}"></span>`).join('')}</div></div>` : '';
  return `<header class="masthead"><div class="in"><div>
      <span class="eyebrow">naqsha · ${esc(kind)}</span>
      <h1>${txt0(m.title || 'Untitled plan')}</h1>
      <div class="meta">${pill(m.status)}
        ${m.updated ? `<span>Updated ${esc(m.updated)}</span>` : ''}
        ${m.approvedAt ? `<span class="sep">/</span><span>Approved ${esc(m.approvedAt.slice(0, 10))}</span>` : ''}
        ${m.effort ? `<span class="sep">/</span><span>${esc(m.effort)} effort</span>` : ''}
        ${m.buildMode ? `<span class="sep">/</span><span>${esc(m.buildMode)} build</span>` : ''}
        ${m.research && m.research !== 'full' ? `<span class="pill st-blocked">Research ${txt0(m.research)}</span>` : ''}
      </div></div>${right}</div></header>`;
}

function render(p) {
  const m = p.meta || {};
  const ask = asking(p);
  indexIds(p);
  document.title = (m.title || 'Plan') + (m.kind === 'design' ? ' · design' : m.kind === 'demo' ? ' · demo' : ' · plan');
  const tabs = (m.kind === 'design' ? DESIGN_TABS : m.kind === 'demo' ? DEMO_TABS : TABS).filter(([id]) => id !== 'questions' || phasesOf(p).length);
  if (!tabs.some(([id]) => id === activeTab)) {
    activeTab = openItems(p).length && tabs.some(([id]) => id === 'questions') ? 'questions' : 'overview';
  }
  // The overview's summary is drawn at its top, so it isn't listed twice.
  const secsOf = (id, secs) => id === 'overview' ? secs.filter(x => x !== 'summary') : secs;
  const bar = tabs.map(([id, title, secs], i) => {
    const todo = secs.some(x => !present(p, x));
    const subs = secsOf(id, secs).length > 1 ? `<ul class="sub" data-sub="${id}"${id === activeTab ? '' : ' hidden'}>${
      secsOf(id, secs).map(x => `<li><a href="#${x}">${SECTION[x][1]}</a></li>`).join('')}</ul>` : '';
    return `<button type="button" role="tab" id="tab-${id}" data-tab="${id}"
      aria-controls="panel-${id}" aria-selected="${id === activeTab}" tabindex="${id === activeTab ? 0 : -1}"
      class="${todo ? 'todo' : ''}"${todo ? ' title="Has sections not written yet"' : ''}><span class="n">${String(i + 1).padStart(2, '0')}</span>${title}${
      id === 'questions' ? '<span class="count-badge" id="open-count"></span>' : ''}</button>${subs}`;
  }).join('');
  const panels = tabs.map(([id, , secs]) => `<div role="tabpanel" id="panel-${id}" aria-labelledby="tab-${id}"${id === activeTab ? '' : ' hidden'}>
    ${id === 'overview' ? overviewTop(p, ask) : ''}
    ${id === 'questions' ? questionsTab(p, ask) : secsOf(id, secs).map(x => sectionHtml(p, ask, x)).join('')}</div>`).join('');

  app.innerHTML = `${masthead(p)}
    <div class="shell">
      <nav class="rail"><div role="tablist" aria-label="Plan sections" aria-orientation="vertical">${bar}</div></nav>
      <main class="content">
        ${panels}
        ${ask ? `<div class="sendbar" role="region" aria-label="Send to Claude">
          <span class="count" id="count"></span>
          <input type="text" id="message" placeholder="Message to Claude (optional)" aria-label="Message to Claude">
          <button type="button" class="primary" data-action="send">Send to Claude</button>
          <span class="status${status.bad ? ' bad' : ''}" id="status" role="status">${esc(status.text)}</span>
        </div>` : ''}
        <footer>Rendered from plan.js · refreshes when the file changes</footer>
      </main>
    </div>`;
  restore();
  drawDiagrams();
  fitFrames();
}

// Switching tabs and phases only flips visibility, so nothing typed is lost.
function setTab(id, focus = false) {
  const tab = app.querySelector(`[role=tab][data-tab="${CSS.escape(id)}"]`);
  if (!tab) return;
  activeTab = id;
  saveView();
  for (const t of app.querySelectorAll('[role=tab]')) {
    const on = t === tab;
    t.setAttribute('aria-selected', String(on));
    t.tabIndex = on ? 0 : -1;
  }
  for (const s of app.querySelectorAll('[data-sub]')) s.hidden = s.dataset.sub !== id;
  for (const panel of app.querySelectorAll('[role=tabpanel]')) panel.hidden = panel.id !== `panel-${id}`;
  if (focus) tab.focus();
  drawDiagrams();
  fitFrames();
}

function setPhase(i) {
  activePhase = i;
  saveView();
  for (const panel of app.querySelectorAll('[data-phase-panel]')) panel.hidden = Number(panel.dataset.phasePanel) !== i;
  for (const b of app.querySelectorAll('.phase[data-phase]')) {
    const on = Number(b.dataset.phase) === i;
    b.classList.toggle('current', on);
    b.setAttribute('aria-current', on ? 'step' : 'false');
  }
  const top = app.querySelector('.phases');
  if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView({ block: 'start' });
  fitFrames(); // previews in a phase that was hidden have no size yet
}

// A link to anything on the page opens the tab and phase it lives in.
function goTo(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const panel = el.closest('[role=tabpanel]');
  if (panel) setTab(panel.id.slice('panel-'.length));
  const phase = el.closest('[data-phase-panel]');
  if (phase) setPhase(Number(phase.dataset.phasePanel));
  const folded = el.closest('details');
  if (folded) folded.open = true;
  el.scrollIntoView({ block: 'start' });
}

// Puts the draft back into the freshly rendered inputs.
function restore() {
  for (const el of app.querySelectorAll('[data-id]')) {
    const a = draft.answers[el.dataset.id];
    if (el.dataset.f === 'choice') el.checked = !!a && a.choice.includes(el.value);
    else el.value = (a && a[el.dataset.f]) || '';
  }
  for (const el of app.querySelectorAll('[data-comment]')) el.value = draft.comments[el.dataset.comment] || '';
  for (const el of app.querySelectorAll('[data-sent]')) {
    let a = null;
    try { a = JSON.parse(draft.sent[el.dataset.sent]); } catch { /* nothing sent */ }
    el.textContent = a ? `Sent: ${answerText(a)}. Waiting for Claude to record it.` : '';
  }
  const msg = document.getElementById('message');
  if (msg) msg.value = draft.message;
  updateBar();
}

function updateBar() {
  const count = document.getElementById('count');
  if (!plan) return;
  if (!count) return updatePhases();
  const open = openItems(plan);
  const done = open.filter(d => answered(draft.answers[d.id])).length;
  const comments = Object.values(draft.comments).filter(t => t.trim()).length;
  updatePhases();
  count.textContent = [open.length ? `${done} of ${open.length} answered` : '', comments ? `${comments} comment${comments > 1 ? 's' : ''}` : '']
    .filter(Boolean).join(' · ') || 'Nothing to send yet';
  app.querySelector('[data-action="send"]').disabled = toSend().nothing;
}

// Answered counts in the phase stepper and the Questions tab, as you type.
function updatePhases() {
  let waiting = 0;
  for (const b of app.querySelectorAll('.phase[data-open]')) {
    const open = b.dataset.open.split(' ').filter(Boolean);
    const total = Number(b.dataset.total);
    const k = total - open.length + open.filter(id => answered(draft.answers[id])).length;
    waiting += total - k;
    b.querySelector('.k').textContent = `${k}/${total}`;
    b.classList.toggle('complete', k === total);
    b.querySelector('.num').textContent = k === total ? '✓' : String(Number(b.dataset.phase) + 1);
  }
  const badge = document.getElementById('open-count');
  if (badge) badge.textContent = waiting ? String(waiting) : '';
}

function toSend() {
  const ids = new Set(openItems(plan).map(d => d.id));
  const answers = Object.entries(draft.answers).filter(([id, a]) => ids.has(id) && unsent(id, a)).map(([id, a]) => ({ id, ...a }));
  const comments = Object.entries(draft.comments).filter(([, t]) => t.trim()).map(([section, text]) => ({ section, text }));
  const message = draft.message.trim();
  return { answers, comments, message, nothing: !answers.length && !comments.length && !message };
}

function setStatus(text, bad = false) {
  status = { text, bad };
  const el = document.getElementById('status');
  if (el) { el.textContent = text; el.className = 'status' + (bad ? ' bad' : ''); }
}

async function send() {
  const out = toSend();
  if (out.nothing) return;
  setStatus('Sending…');
  try {
    const r = await fetch('submit?key=' + encodeURIComponent(KEY), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers: out.answers, comments: out.comments, message: out.message }),
    });
    if (!r.ok) throw new Error(await r.text());
  } catch (e) {
    setStatus(`Not sent: ${e.message === 'Failed to fetch' || e.name === 'TypeError' ? 'the page server isn’t running' : e.message}. ` +
      'Everything you wrote is kept here. Ask Claude to restart the page, then send again.', true);
    return;
  }
  for (const a of out.answers) draft.sent[a.id] = JSON.stringify({ choice: a.choice, text: a.text, note: a.note });
  draft.comments = {};
  draft.message = '';
  opened.clear();
  saveDraft();
  setStatus(`Sent at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}. Claude is updating the plan; this page follows along.`);
  render(plan);
}

function useRecommendations() {
  for (const d of openItems(plan)) {
    if (d.recommendation && !answered(draft.answers[d.id])) {
      draft.answers[d.id] = { choice: [d.recommendation], text: '', note: (draft.answers[d.id] || {}).note || '' };
    }
  }
  saveDraft();
  restore();
}

function onInput(e) {
  const el = e.target;
  if (el.dataset.comment) {
    draft.comments[el.dataset.comment] = el.value;
  } else if (el.dataset.id) {
    const a = draft.answers[el.dataset.id] || (draft.answers[el.dataset.id] = { choice: [], text: '', note: '' });
    if (el.dataset.f === 'choice') a.choice = [...app.querySelectorAll(`input[name="${CSS.escape(el.name)}"]:checked`)].map(i => i.value);
    else a[el.dataset.f] = el.value;
  } else if (el.id === 'message') {
    draft.message = el.value;
  } else return;
  saveDraft();
  updateBar();
}

app.addEventListener('input', onInput);
app.addEventListener('change', onInput);
app.addEventListener('toggle', e => {
  const d = e.target;
  if (d.dataset && d.dataset.step) stepOpen[d.dataset.step] = d.open;
}, true);
app.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#"]');
  if (link) {
    e.preventDefault();
    goTo(decodeURIComponent(link.getAttribute('href').slice(1)));
    return;
  }
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.tab) setTab(t.dataset.tab);
  else if (t.dataset.steps) {
    for (const d of app.querySelectorAll('details[data-step]')) d.open = t.dataset.steps === 'open';
  }
  else if (t.dataset.seek !== undefined || t.dataset.action === 'stamp') {
    const v = document.getElementById('demo-video');
    if (!v) return;
    if (t.dataset.seek !== undefined) { v.currentTime = Number(t.dataset.seek); v.play().catch(() => {}); return; }
    v.pause();
    const stamp = `[${Math.floor(v.currentTime / 60)}:${(v.currentTime % 60).toFixed(1).padStart(4, '0')}] `;
    const box = app.querySelector('[data-comment="video"]');
    if (!box) return;
    box.hidden = false;
    opened.add('video');
    box.value = (box.value ? box.value.replace(/\s*$/, '\n') : '') + stamp;
    draft.comments.video = box.value;
    saveDraft();
    box.focus();
    updateBar();
  }
  else if (t.dataset.format) { videoFormat = t.dataset.format; render(plan); }
  else if (t.dataset.width || t.dataset.dark || t.dataset.state) {
    if (t.dataset.width) frameWidth = t.dataset.width;
    else if (t.dataset.dark) frameDark = !frameDark;
    else frameState[t.dataset.screen] = t.dataset.state;
    const y = scrollY;
    render(plan);
    scrollTo(0, y);
  }
  else if (t.dataset.phase !== undefined) setPhase(Number(t.dataset.phase));
  else if (t.dataset.action === 'send') send();
  else if (t.dataset.action === 'recommend') useRecommendations();
  else if (t.dataset.toggle) {
    const box = app.querySelector(`[data-comment="${CSS.escape(t.dataset.toggle)}"]`);
    box.hidden = !box.hidden;
    if (box.hidden) opened.delete(t.dataset.toggle); else { opened.add(t.dataset.toggle); box.focus(); }
  }
});
// Arrow keys, Home and End move between tabs (the WAI-ARIA tabs pattern).
app.addEventListener('keydown', e => {
  const t = e.target.closest('[role=tab]');
  if (!t || !['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return;
  const tabs = [...app.querySelectorAll('[role=tab]')];
  const i = tabs.indexOf(t);
  const fwd = e.key === 'ArrowRight' || e.key === 'ArrowDown';
  const j = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (fwd ? 1 : -1) + tabs.length) % tabs.length;
  e.preventDefault();
  setTab(tabs[j].dataset.tab, true);
});
// Never re-render under someone typing; catch up when they leave the field.
app.addEventListener('focusout', () => setTimeout(() => { if (pending) show(pending); }, 0));

function show(p) {
  const a = document.activeElement;
  if (a && app.contains(a) && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type === 'text'))) { pending = p; return; }
  pending = null;
  const first = !plan;
  plan = p;
  if (first) { loadDraft(); loadView(); }
  // Forget drafts for questions Claude has recorded.
  const ids = new Set(openItems(p).map(d => d.id));
  for (const id of Object.keys(draft.answers)) if (!ids.has(id)) delete draft.answers[id];
  for (const id of Object.keys(draft.sent)) if (!ids.has(id)) delete draft.sent[id];
  saveDraft();
  const y = scrollY;
  render(p);
  scrollTo(0, y);
}

// Fetched once, as soon as the plan has a diagram anywhere, so a tab with
// one draws without waiting on the CDN.
let mermaidLoad = null;
const loadMermaid = () => mermaidLoad || (mermaidLoad = import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs').then(m => {
  m.default.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'base', fontFamily: 'IBM Plex Sans, system-ui, sans-serif',
    themeVariables: { background: '#fffdf9', primaryColor: '#e8ecfa', primaryBorderColor: '#2447c9', primaryTextColor: '#1c1b18', lineColor: '#8b877d', secondaryColor: '#efece5', tertiaryColor: '#fffdf9', fontSize: '14px' } });
  return m.default;
}));
async function drawDiagrams() {
  const all = [...document.querySelectorAll('[data-mermaid]')];
  if (!all.length) return;
  const els = all.filter(el => !el.closest('[hidden]') && !el.querySelector('svg'));
  try {
    const mermaid = await loadMermaid();
    for (const [i, el] of els.entries()) {
      const { svg } = await mermaid.render('mmd' + i + Date.now(), el.dataset.mermaid);
      el.innerHTML = svg;
    }
  } catch { /* offline or invalid diagram: the source stays visible */ }
}

// file:// pages can't fetch(), but they can load a script, so poll by reloading plan.js.
let reachable = true;
function load() {
  const s = document.createElement('script');
  s.src = 'plan.js?t=' + Date.now() + (KEY ? '&key=' + encodeURIComponent(KEY) : '');
  s.onload = s.onerror = e => {
    s.remove();
    if (LIVE && (e.type === 'error') === reachable) {
      reachable = e.type !== 'error';
      if (!reachable) setStatus('Can’t reach the page server. Keep writing; it’s saved here. Ask Claude to restart the page before you send.', true);
      else if (status.bad) setStatus('');
    }
    const p = window.NAQSHA;
    const now = p ? JSON.stringify(p) : '';
    if (now && now !== last) {
      last = now;
      show(p);
    }
  };
  document.head.appendChild(s);
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
