<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan</title>
<style>
:root {
  --bg: #fbfbfa; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e3df;
  --accent: #2f5bd3; --warn-bg: #fff6e0; --warn: #8a5a00; --ok: #1f7a46; --bad: #b42318; --code: #f2f1ee;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #a3a29c; --line: #34332f;
    --accent: #8aa8ff; --warn-bg: #3a2d10; --warn: #f2c46b; --ok: #6fcf97; --bad: #ff8a80; --code: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 24px 16px 80px; }
header h1 { font-size: 1.7rem; margin: 0 0 6px; line-height: 1.25; }
.meta { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 6px 16px; }
nav { margin: 18px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; }
nav a { font-size: .85rem; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); text-decoration: none; background: var(--panel); }
nav a.todo { border-style: dashed; color: var(--muted); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 14px 0; scroll-margin-top: 12px; }
section > h2 { font-size: 1.15rem; margin: 0 0 10px; }
h3 { font-size: .95rem; margin: 14px 0 6px; }
h3:first-child { margin-top: 0; }
a { color: var(--accent); }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .88em; }
pre { background: var(--code); padding: 10px; border-radius: 6px; overflow-x: auto; font-size: .85rem; }
ul { margin: 4px 0; padding-left: 20px; }
li { margin: 2px 0; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
.scroll { overflow-x: auto; }
.badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.s-draft, .s-open, .s-todo { color: var(--warn); }
.s-approved, .s-decided, .s-done { color: var(--ok); }
.s-building, .s-doing { color: var(--accent); }
.s-blocked, .v-avoid { color: var(--bad); }
.v-adopt { color: var(--ok); }
.v-learn-from { color: var(--accent); }
.na, .muted { color: var(--muted); }
.empty { color: var(--warn); font-style: italic; }
.waiting { background: var(--warn-bg); border-color: var(--warn); }
.waiting h2 { color: var(--warn); }
.decision { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
.decision:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 8px 0; }
.option { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.option.rec { border-color: var(--accent); }
.option.chosen { border-color: var(--ok); border-width: 2px; }
.option h4 { margin: 0 0 4px; font-size: .92rem; }
.pc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: .85rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.stat b { display: block; font-size: 1.3rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.diagram { overflow-x: auto; }
footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
@media (max-width: 560px) { .pc { grid-template-columns: 1fr; } }
@media print { nav, footer { display: none; } section { break-inside: avoid; } }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading plan.js…</p></main>
<script>
'use strict';
const app = document.getElementById('app');
let last = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Plain text with `code` spans and line breaks; everything else stays escaped.
const txt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
const isNa = v => v && typeof v === 'object' && !Array.isArray(v) && typeof v.na === 'string';
const has = v => isNa(v) || (Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.keys(v).length > 0 : !!v);
const na = v => `<p class="na">Not applicable: ${txt(v.na)}</p>`;
const empty = '<p class="empty">Not written yet.</p>';
const badge = s => s ? `<span class="badge s-${esc(s)}">${esc(s)}</span>` : '';
const url = u => /^https?:\/\//i.test(u || '') ? esc(u) : null;
const list = (items, f = txt) => isNa(items) ? na(items) : Array.isArray(items) && items.length ? `<ul>${items.map(i => `<li>${f(i)}</li>`).join('')}</ul>` : empty;
const ref = r => r ? ` <code>${esc(r)}</code>` : '';
const table = (rows, cols) => {
  if (isNa(rows)) return na(rows);
  if (!Array.isArray(rows) || !rows.length) return empty;
  return `<div class="scroll"><table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c => `<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
// An empty dependency list is an answer ("none"); elsewhere empty means unwritten.
const present = (p, id) => id === 'dependencies' ? Array.isArray(p[id]) || isNa(p[id]) : has(p[id]);
const pert = e => (e.low + 4 * e.likely + e.high) / 6;
const hours = h => h >= 10 ? Math.round(h) + ' h' : (Math.round(h * 10) / 10) + ' h';

const SECTIONS = [
  ['summary', 'Summary', p => {
    const s = p.summary;
    if (isNa(s)) return na(s);
    return `${s.problem ? `<h3>Problem</h3><p>${txt(s.problem)}</p>` : ''}
      ${s.outcome ? `<h3>Outcome</h3><p>${txt(s.outcome)}</p>` : ''}
      <h3>Users</h3>${list(s.users)}<h3>Goals</h3>${list(s.goals)}<h3>Non-goals</h3>${list(s.nonGoals)}`;
  }],
  ['requirements', 'Requirements', p => {
    const r = p.requirements;
    if (isNa(r)) return na(r);
    return `<h3>Functional</h3>${table(r.functional, [['ID', x => esc(x.id)], ['Requirement', x => txt(x.text)], ['Source', x => esc(x.source)]])}
      <h3>Non-functional</h3>${table(r.nonFunctional, [['ID', x => esc(x.id)], ['Requirement', x => txt(x.text)], ['Target', x => txt(x.target)]])}
      <h3>Constraints</h3>${list(r.constraints)}`;
  }],
  ['context', 'Existing codebase', p => {
    const c = p.context;
    if (isNa(c)) return na(c);
    return `<h3>Stack</h3>${list(c.stack)}
      <h3>Conventions to follow</h3>${list(c.conventions, x => txt(x.text) + ref(x.ref))}
      <h3>Reused, not rebuilt</h3>${list(c.reuse, x => txt(x.what) + ref(x.ref))}
      <h3>Files this touches</h3>${table(c.touches, [['Path', x => `<code>${esc(x.path)}</code>`], ['Why', x => txt(x.why)]])}`;
  }],
  ['priorArt', 'Prior art', p => isNa(p.priorArt) ? na(p.priorArt) : !has(p.priorArt) ? empty : p.priorArt.map(a => `
      <h3>${url(a.url) ? `<a href="${url(a.url)}" target="_blank" rel="noopener noreferrer">${txt(a.name)}</a>` : txt(a.name)}
        <span class="muted">· ${esc(a.kind)}</span> ${a.verdict ? `<span class="badge v-${esc(String(a.verdict).replace(/\s+/g, '-'))}">${esc(a.verdict)}</span>` : ''}</h3>
      ${a.howItWorks ? `<p><b>How it works:</b> ${txt(a.howItWorks)}</p>` : ''}
      ${a.evidence ? `<p><b>Does it hold up:</b> ${txt(a.evidence)}</p>` : ''}
      ${a.why ? `<p><b>Verdict:</b> ${txt(a.why)}</p>` : ''}
      ${has(a.takeaways) ? `<b>What we take from it</b>${list(a.takeaways)}` : ''}`).join('')],
  ['research', 'Research', p => isNa(p.research) ? na(p.research) : !has(p.research) ? empty : p.research.map(r => `
      <h3>${txt(r.topic)}</h3><p>${txt(r.finding)}</p>
      ${list(r.sources, s => (url(s.url) ? `<a href="${url(s.url)}" target="_blank" rel="noopener noreferrer">${txt(s.title || s.url)}</a>` : txt(s.title)) + (s.accessed ? ` <span class="muted">(${esc(s.accessed)})</span>` : ''))}`).join('')],
  ['decisions', 'Decisions', p => isNa(p.decisions) ? na(p.decisions) : !has(p.decisions) ? empty : p.decisions.map(d => `
      <div class="decision" id="${esc(d.id)}">
        <h3>${esc(d.id)} · ${txt(d.question)} ${badge(d.status)}</h3>
        <div class="options">${(d.options || []).map(o => `
          <div class="option${o.name === d.recommendation ? ' rec' : ''}${o.name === d.choice ? ' chosen' : ''}">
            <h4>${txt(o.name)}${o.name === d.choice ? ' ✓ chosen' : o.name === d.recommendation ? ' · recommended' : ''}</h4>
            <div class="pc"><div><b>Pros</b>${list(o.pros)}</div><div><b>Cons</b>${list(o.cons)}</div></div>
          </div>`).join('')}</div>
        ${d.why ? `<p><b>Why the recommendation:</b> ${txt(d.why)}</p>` : ''}
        ${d.status === 'decided' ? `<p><b>Decided:</b> ${txt(d.choice)} <span class="muted">(${esc(d.decidedBy)})</span>${d.note ? ` · ${txt(d.note)}` : ''}</p>` : ''}
      </div>`).join('')],
  ['architecture', 'Architecture', p => {
    const a = p.architecture;
    if (isNa(a)) return na(a);
    return `${a.overview ? `<p>${txt(a.overview)}</p>` : empty}
      ${a.diagram ? `<div class="diagram" data-mermaid="${esc(a.diagram)}"><pre>${esc(a.diagram)}</pre></div>` : ''}
      <h3>Components</h3>${table(a.components, [['Component', x => txt(x.name) + (x.new ? ' <span class="badge s-doing">new</span>' : '')], ['Responsibility', x => txt(x.responsibility)]])}
      <h3>Data model</h3>${table(a.dataModel, [['Entity', x => `<code>${esc(x.entity)}</code>`], ['Fields', x => txt(x.fields)], ['Notes', x => txt(x.notes)]])}
      <h3>Interfaces</h3>${table(a.interfaces, [['Name', x => `<code>${esc(x.name)}</code>`], ['Contract', x => txt(x.contract)], ['Notes', x => txt(x.notes)]])}`;
  }],
  ['security', 'Security', p => {
    const s = p.security;
    if (isNa(s)) return na(s);
    return `<h3>What we protect</h3>${list(s.assets)}<h3>Trust boundaries</h3>${list(s.boundaries)}
      <h3>Threats and mitigations</h3>${table(s.threats, [['ID', x => esc(x.id)], ['Threat', x => txt(x.threat) + `<br><span class="muted">${esc(x.category)}</span>`], ['Mitigation', x => txt(x.mitigation) + (x.ref ? `<br><span class="muted">${txt(x.ref)}</span>` : '')], ['Step', x => esc(x.step)]])}`;
  }],
  ['quality', 'Reliability and quality', p => {
    const q = p.quality;
    if (isNa(q)) return na(q);
    const names = { errors: 'Error handling', observability: 'Observability', performance: 'Performance', accessibility: 'Accessibility', migration: 'Data migration and rollback' };
    return Object.entries(names).map(([k, n]) => `<h3>${n}</h3>${list(q[k])}`).join('');
  }],
  ['dependencies', 'New dependencies', p => isNa(p.dependencies) ? na(p.dependencies) : Array.isArray(p.dependencies) && !p.dependencies.length ? '<p class="na">None. Everything uses what the project already has.</p>' :
    table(p.dependencies, [['Package', x => `<code>${esc(x.name)}@${esc(x.version)}</code>`], ['Why', x => txt(x.why) + (x.insteadOf ? `<br><span class="muted">instead of ${txt(x.insteadOf)}</span>` : '')], ['License', x => esc(x.license)], ['Health', x => txt(x.health)]])],
  ['testing', 'Testing', p => {
    const t = p.testing;
    if (isNa(t)) return na(t);
    return `<h3>Strategy</h3>${list(t.strategy)}<h3>Acceptance criteria</h3>${table(t.acceptance, [['ID', x => esc(x.id)], ['Criterion', x => txt(x.text)]])}`;
  }],
  ['steps', 'Implementation steps', p => !has(p.steps) || isNa(p.steps) ? empty : table(p.steps, [
    ['ID', x => esc(x.id)],
    ['Step', x => `<b>${txt(x.title)}</b>${x.detail ? `<br>${txt(x.detail)}` : ''}${(x.files || []).length ? `<br>${x.files.map(f => `<code>${esc(f)}</code>`).join(' ')}` : ''}${x.notes ? `<br><span class="muted">${txt(x.notes)}</span>` : ''}`],
    ['Done when', x => txt(x.doneWhen) || '<span class="empty">missing</span>'],
    ['Hours', x => x.estimate ? `${esc(x.estimate.low)}–${esc(x.estimate.high)}<br><span class="muted">likely ${esc(x.estimate.likely)}</span>` : '<span class="empty">missing</span>'],
    ['Status', x => badge(x.status) + ((x.dependsOn || []).length ? `<br><span class="muted">after ${esc(x.dependsOn.join(', '))}</span>` : '')],
  ])],
  ['risks', 'Risks', p => table(p.risks, [['Risk', x => txt(x.risk)], ['Likelihood', x => esc(x.likelihood)], ['Impact', x => esc(x.impact)], ['Mitigation', x => txt(x.mitigation)]])],
  ['rejected', 'Deliberately not doing', p => table(p.rejected, [['Option', x => txt(x.option)], ['Why not', x => txt(x.why)]])],
  ['changelog', 'Change log', p => table(p.changelog, [['Date', x => esc(x.date)], ['Change', x => txt(x.change)], ['By', x => esc(x.by)]])],
];

function render(p) {
  const m = p.meta || {};
  document.title = (m.title || 'Plan') + ' · plan';
  const open = Array.isArray(p.decisions) ? p.decisions.filter(d => d.status !== 'decided') : [];
  const steps = Array.isArray(p.steps) ? p.steps : [];
  const est = steps.filter(s => s.estimate && [s.estimate.low, s.estimate.likely, s.estimate.high].every(n => typeof n === 'number'));
  const sum = k => est.reduce((t, s) => t + s.estimate[k], 0);
  const done = steps.filter(s => s.status === 'done').length;

  app.innerHTML = `
    <header>
      <h1>${txt(m.title || 'Untitled plan')}</h1>
      <div class="meta">
        ${badge(m.status)}
        <span>${m.kind === 'new-app' ? 'New app' : 'Feature'}</span>
        ${m.updated ? `<span>Updated ${esc(m.updated)}</span>` : ''}
        ${m.approvedAt ? `<span>Approved ${esc(m.approvedAt.slice(0, 10))}</span>` : ''}
        ${m.research && m.research !== 'full' ? `<span class="s-blocked">Research ${txt(m.research)}</span>` : ''}
      </div>
    </header>
    ${open.length ? `<section class="waiting"><h2>Waiting on you</h2><p>These decisions need your answer before the plan can be approved:</p>
      ${list(open, d => `<a href="#${esc(d.id)}">${esc(d.id)}</a> · ${txt(d.question)}`)}</section>` : ''}
    <section>
      <h2>Estimate</h2>
      <div class="stats">
        <div class="stat"><span class="muted">Expected</span><b>${est.length ? hours(est.reduce((t, s) => t + pert(s.estimate), 0)) : '—'}</b></div>
        <div class="stat"><span class="muted">Range</span><b>${est.length ? `${hours(sum('low'))} – ${hours(sum('high'))}` : '—'}</b></div>
        <div class="stat"><span class="muted">Progress</span><b>${done} / ${steps.length} steps</b><div class="bar"><i style="width:${steps.length ? (100 * done / steps.length) : 0}%"></i></div></div>
      </div>
      <p class="muted">Human developer hours: ${txt(m.developer || 'developer profile not set')}. Expected = (low + 4 × likely + high) / 6 per step.</p>
    </section>
    <nav>${SECTIONS.map(([id, title]) => `<a href="#${id}"${present(p, id) ? '' : ' class="todo"'}>${title}</a>`).join('')}</nav>
    ${SECTIONS.map(([id, title, f]) => `<section id="${id}"><h2>${title}</h2>${present(p, id) ? f(p) : empty}</section>`).join('')}
    <footer>Rendered from plan.js · refreshes when the file changes</footer>`;
  drawDiagrams();
}

let mermaid = null;
async function drawDiagrams() {
  const els = [...document.querySelectorAll('[data-mermaid]')];
  if (!els.length) return;
  try {
    mermaid = mermaid || (await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs')).default;
    mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'default' });
    for (const [i, el] of els.entries()) {
      const { svg } = await mermaid.render('mmd' + i + Date.now(), el.dataset.mermaid);
      el.innerHTML = svg;
    }
  } catch { /* offline or invalid diagram: the source stays visible */ }
}

// file:// pages can't fetch(), but they can load a script, so poll by reloading plan.js.
function load() {
  const s = document.createElement('script');
  s.src = 'plan.js?t=' + Date.now();
  s.onload = s.onerror = () => {
    s.remove();
    const p = window.NAQSHA;
    const now = p ? JSON.stringify(p) : '';
    if (now && now !== last) {
      last = now;
      const y = scrollY;
      render(p);
      scrollTo(0, y);
    }
  };
  document.head.appendChild(s);
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
